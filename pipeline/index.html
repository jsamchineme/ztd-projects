<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mapboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --font:'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  --canvas:#E8EBEF; --dot:#C3C9D2; --chrome:#FCFCFB; --chrome-2:#EEF0F3; --ink:#1E232B; --muted:#5F6773;
  --line:#3B4350; --edge:#D5DAE1; --accent:#3346C8; --accent-soft:rgba(51,70,200,.13); --paper:#FFFFFF;
  --frame-fill:rgba(255,255,255,.45); --frame-line:#B5BCC7; --danger:#B42318;
  --shadow:0 1px 2px rgba(20,24,31,.06), 0 10px 28px -10px rgba(20,24,31,.22);
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --canvas:#16181C; --dot:#2C3038; --chrome:#202329; --chrome-2:#2B2F36; --ink:#E6E8EB; --muted:#9AA2AE;
    --line:#B7BFCB; --edge:#363B44; --accent:#8C9BFF; --accent-soft:rgba(140,155,255,.17); --paper:#2A2E35;
    --frame-fill:rgba(255,255,255,.03); --frame-line:#4A505B; --danger:#FF8A7A;
    --shadow:0 1px 2px rgba(0,0,0,.3), 0 12px 30px -10px rgba(0,0,0,.6);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --canvas:#16181C; --dot:#2C3038; --chrome:#202329; --chrome-2:#2B2F36; --ink:#E6E8EB; --muted:#9AA2AE;
  --line:#B7BFCB; --edge:#363B44; --accent:#8C9BFF; --accent-soft:rgba(140,155,255,.17); --paper:#2A2E35;
  --frame-fill:rgba(255,255,255,.03); --frame-line:#4A505B; --danger:#FF8A7A;
  --shadow:0 1px 2px rgba(0,0,0,.3), 0 12px 30px -10px rgba(0,0,0,.6);
  color-scheme:dark;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--canvas);color:var(--ink);font-family:var(--font);overflow:hidden;-webkit-font-smoothing:antialiased;overscroll-behavior:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
[hidden]{display:none!important}

#app{position:relative;height:100%;overflow:hidden}
#viewport{position:absolute;inset:0;overflow:hidden;touch-action:none;background-color:var(--canvas);
  background-image:radial-gradient(circle, var(--dot) 1.1px, transparent 1.3px);user-select:none;-webkit-user-select:none}
#viewport[data-tool="hand"],#viewport.space{cursor:grab}
#viewport.panning{cursor:grabbing}
#viewport[data-tool="note"],#viewport[data-tool="text"],#viewport[data-tool="rect"],#viewport[data-tool="ellipse"],
#viewport[data-tool="diamond"],#viewport[data-tool="frame"],#viewport[data-tool="connector"],#viewport[data-tool="pen"]{cursor:crosshair}
#world{position:absolute;left:0;top:0;transform-origin:0 0}
.layer{position:absolute;left:0;top:0}
#items{isolation:isolate}
#links{position:absolute;left:0;top:0;width:1px;height:1px;overflow:visible;pointer-events:none}
#links .hit{stroke:transparent;fill:none;pointer-events:stroke;cursor:pointer}
#links .ln{fill:none;stroke-linecap:round;stroke-linejoin:round}
#links .pv{fill:none;stroke:var(--accent);stroke-dasharray:6 6;stroke-linecap:round}
#links .penpv{fill:none;stroke:var(--ink);stroke-linecap:round;stroke-linejoin:round}

/* items */
.item{position:absolute;display:flex;align-items:center;justify-content:center;text-align:center;padding:14px;
  font-size:var(--fs);line-height:1.32;color:var(--c-text);overflow-wrap:anywhere;font-weight:500}
#viewport[data-tool="select"] .item{cursor:move}
.item .t{position:relative;width:100%;max-height:100%;overflow:hidden;white-space:pre-wrap;outline:none}
.item .t a.lnk{color:inherit;text-decoration:underline;text-decoration-thickness:1px;text-underline-offset:2px;overflow-wrap:anywhere}
#viewport[data-tool="select"] .item .t a.lnk{cursor:pointer}
#viewport[data-tool="select"] .item .t a.lnk:hover{text-decoration-thickness:2px}
.item.editing .t{user-select:text;-webkit-user-select:text;cursor:text;overflow:auto}
.note{background-color:var(--fill);background-image:linear-gradient(168deg,rgba(255,255,255,.38),rgba(255,255,255,0) 46%);
  border-radius:3px 3px 22px 3px / 3px 3px 9px 3px;
  box-shadow:0 1px 1px rgba(25,28,35,.12),0 12px 20px -12px rgba(25,28,35,.5)}
.rect{background:var(--fill);border:2px solid var(--c-ink);border-radius:12px}
.ellipse{background:var(--fill);border:2px solid var(--c-ink);border-radius:50%;padding:16px 24px}
.diamond{padding:16% 22%}
.diamond .dia{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.diamond polygon{fill:var(--fill);stroke:var(--c-ink);stroke-width:2;vector-effect:non-scaling-stroke}
.text{height:auto;min-height:1.4em;justify-content:flex-start;align-items:flex-start;text-align:left;padding:2px;
  color:var(--c-ink);letter-spacing:-.01em}
.text .t:empty::before{content:'Type something';color:var(--muted);font-weight:400}
.text.big{font-weight:700}
.frame{display:block;padding:0;background:var(--c-frame-fill);border:1.5px solid var(--c-frame-line);border-radius:16px;pointer-events:none}
.frame .t{position:absolute;left:0;bottom:100%;width:auto;max-width:100%;margin-bottom:calc(6px / var(--z));padding:0 2px;
  font-size:min(calc(14px / var(--z)), 30px);font-weight:600;color:var(--muted);text-align:left;white-space:nowrap;
  overflow:hidden;text-overflow:ellipsis;pointer-events:auto;cursor:move;line-height:1.25}
.frame .t:empty::before{content:'Untitled frame';opacity:.6}
.frame.editing .t{text-overflow:clip}
.pen{display:block;padding:0;pointer-events:none}
.pen svg{position:absolute;left:0;top:0;width:100%;height:100%;overflow:visible}
.pen .ph{fill:none;stroke:transparent;stroke-width:14;pointer-events:stroke;cursor:move}
.pen .pl{fill:none;stroke:var(--c-ink);stroke-linecap:round;stroke-linejoin:round;pointer-events:none}

.lbl{position:absolute;transform:translate(-50%,-50%);background:var(--canvas);color:var(--ink);font-size:14px;font-weight:500;
  padding:2px 7px;border-radius:7px;white-space:pre;cursor:pointer;outline:none;min-width:1.5ch;text-align:center}
.lbl.sel{box-shadow:0 0 0 1.5px var(--accent)}
.lbl.editing{box-shadow:0 0 0 1.5px var(--accent);user-select:text;-webkit-user-select:text;cursor:text}
.lbl.editing:empty::before{content:'Label';color:var(--muted)}

/* selection overlay */
#sel{pointer-events:none}
#sel > div{position:absolute}
.ol{border:solid var(--accent);border-radius:3px}
.gb{border:dashed var(--accent)}
.tg{border:solid var(--accent);border-radius:6px;background:var(--accent-soft)}
.hd{background:var(--chrome);border:solid var(--accent);border-radius:3px;pointer-events:auto}
.hd[data-handle="nw"],.hd[data-handle="se"]{cursor:nwse-resize}
.hd[data-handle="ne"],.hd[data-handle="sw"]{cursor:nesw-resize}
.port{border-radius:50%;background:var(--accent);pointer-events:auto;cursor:crosshair;opacity:.85}
.bend{background:var(--chrome);border:solid var(--accent);border-radius:50%;pointer-events:auto;cursor:grab;box-shadow:0 0 0 calc(4px / var(--z)) var(--accent-soft)}
.bend:hover{background:var(--accent)}
.port:hover{opacity:1;box-shadow:0 0 0 calc(5px / var(--z)) var(--accent-soft)}
.mq{background:var(--accent-soft);border:solid var(--accent)}
.cp{border:dashed var(--accent);border-radius:4px}

/* chrome */
.topbar,.rail,#ctx,#drawer,#help{user-select:none;-webkit-user-select:none}
#boardName{user-select:text;-webkit-user-select:text}
.topbar{position:absolute;top:12px;left:12px;right:12px;display:flex;justify-content:space-between;align-items:flex-start;gap:8px;pointer-events:none;z-index:20}
.pill{display:flex;align-items:center;gap:2px;padding:5px;background:var(--chrome);border:1px solid var(--edge);border-radius:13px;box-shadow:var(--shadow);pointer-events:auto;min-width:0}
.ib{width:34px;height:34px;display:grid;place-items:center;border-radius:9px;color:var(--ink);flex:none}
.ib:hover{background:var(--chrome-2)}
.ib:disabled{opacity:.35;cursor:default;background:none}
.sep{width:1px;height:20px;background:var(--edge);margin:0 4px;flex:none}
#boardName{border:0;background:transparent;font:600 15px/1.2 var(--font);color:var(--ink);padding:7px 8px;border-radius:8px;
  width:clamp(110px,26vw,320px);min-width:0;text-overflow:ellipsis}
#boardName:hover{background:var(--chrome-2)}
#status{font-size:12.5px;color:var(--muted);padding:0 8px 0 4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:240px}
#status[data-kind="err"]{color:var(--danger)}
#zoomPct{min-width:54px;height:34px;border-radius:9px;font-size:13px;font-weight:600;font-variant-numeric:tabular-nums}
#zoomPct:hover{background:var(--chrome-2)}

.rail{position:absolute;left:12px;top:50%;transform:translateY(-50%);display:flex;flex-direction:column;gap:2px;padding:6px;
  background:var(--chrome);border:1px solid var(--edge);border-radius:15px;box-shadow:var(--shadow);z-index:20}
.tb{width:40px;height:40px;display:grid;place-items:center;border-radius:10px;color:var(--ink);flex:none}
.tb:hover{background:var(--chrome-2)}
.tb[aria-pressed="true"]{background:var(--ink);color:var(--chrome)}
.rail .sep{width:22px;height:1px;margin:4px auto}

#ctx{position:fixed;z-index:30;display:flex;align-items:center;gap:2px;padding:5px;background:var(--chrome);border:1px solid var(--edge);
  border-radius:12px;box-shadow:var(--shadow);white-space:nowrap}
#ctx .sws{display:flex;gap:5px;padding:0 6px}
.swatch{width:22px;height:22px;border-radius:50%;background:var(--sw);box-shadow:inset 0 0 0 2px var(--swi);flex:none}
.swatch[aria-pressed="true"]{outline:2px solid var(--accent);outline-offset:2px}
.seg{display:flex;background:var(--chrome-2);border-radius:9px;padding:2px;margin:0 4px}
.seg button{min-width:30px;height:28px;border-radius:7px;font-size:12.5px;font-weight:600;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--chrome);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12)}
#ctx .ib[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent)}

#empty{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);text-align:center;color:var(--muted);font-size:15px;
  line-height:1.5;pointer-events:none;max-width:min(380px,80vw)}
#empty strong{display:block;color:var(--ink);font-size:18px;font-weight:600;margin-bottom:4px}

#scrim{position:absolute;inset:0;background:rgba(10,12,16,.28);z-index:39}
#drawer{position:absolute;top:0;left:0;bottom:0;width:min(350px,90vw);background:var(--chrome);border-right:1px solid var(--edge);
  z-index:40;transform:translateX(-102%);transition:transform .22s ease;display:flex;flex-direction:column;box-shadow:var(--shadow)}
#drawer.open{transform:none}
.dh{display:flex;align-items:center;justify-content:space-between;padding:16px 14px 8px 18px}
.dh h2{font-size:17px;font-weight:700;margin:0}
.newbtn{margin:6px 14px 4px;height:40px;border-radius:10px;background:var(--ink);color:var(--chrome);font-weight:600;font-size:14px}
.tpls{display:grid;gap:6px;padding:8px 14px 4px}
.tpl{text-align:left;padding:10px 12px;border:1px solid var(--edge);border-radius:10px}
.tpl:hover{background:var(--chrome-2)}
.tpl b{display:block;font-size:14px;font-weight:600}
.tpl span{font-size:12.5px;color:var(--muted)}
.tpl.ai{border-color:var(--accent);background:var(--accent-soft)}
.gen{display:grid;gap:8px;padding:8px 14px 4px}
.gen textarea{width:100%;min-height:96px;resize:vertical;font:inherit;font-size:14px;line-height:1.4;color:var(--ink);background:var(--paper);
  border:1px solid var(--edge);border-radius:10px;padding:9px 11px}
.gen textarea:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.gen .row{display:flex;gap:6px;justify-content:flex-end}
.gen .row button{height:34px;padding:0 12px;border-radius:9px;font-size:13.5px;font-weight:600}
.gen .go{background:var(--accent);color:#fff}
.gen .go:disabled{opacity:.55;cursor:default}
.gen .cancel:hover{background:var(--chrome-2)}
.gen .msg{font-size:12.5px;color:var(--muted);line-height:1.4;margin:0}
.gen .msg[data-kind="err"]{color:var(--danger)}
.blist{list-style:none;margin:8px 0 0;padding:0 8px;overflow:auto;flex:1}
.blist li{display:flex;align-items:center;border-radius:10px}
.blist li:hover{background:var(--chrome-2)}
.blist li[aria-current="true"]{background:var(--accent-soft)}
.bopen{flex:1;min-width:0;text-align:left;padding:10px 10px}
.bopen .nm{display:block;font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bopen .dt{font-size:12px;color:var(--muted)}
.bdel{height:30px;padding:0 8px;margin-right:6px;border-radius:8px;color:var(--muted);font-size:12.5px;font-weight:600;display:grid;place-items:center}
.bdel:hover{color:var(--danger);background:var(--chrome)}
.bdel.confirm{color:#fff;background:var(--danger)}
.df{border-top:1px solid var(--edge);padding:10px 12px;display:flex;flex-wrap:wrap;gap:4px}
.df button{display:flex;align-items:center;gap:8px;height:36px;padding:0 10px;border-radius:9px;font-size:13.5px;font-weight:500}
.df button:hover{background:var(--chrome-2)}
.df .note{font-size:12px;color:var(--muted);padding:2px 10px 0;line-height:1.4;flex-basis:100%}

#help{position:absolute;top:64px;right:12px;z-index:25;background:var(--chrome);border:1px solid var(--edge);border-radius:13px;
  box-shadow:var(--shadow);padding:14px 16px;width:min(340px,calc(100% - 24px));font-size:13.5px}
#help h3{margin:0 0 8px;font-size:15px}
#help dl{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;margin:0}
#help dt{font-weight:600;white-space:nowrap}
#help dd{margin:0;color:var(--muted)}

/* ask Claude (edit the open board) */
.ask{position:absolute;left:50%;bottom:16px;transform:translateX(-50%);width:min(640px,calc(100% - 24px));z-index:20;
  background:var(--chrome);border:1px solid var(--edge);border-radius:16px;box-shadow:var(--shadow);padding:6px 6px 6px 12px;user-select:none;-webkit-user-select:none}
.ask:focus-within{border-color:var(--accent)}
.ask .row{display:flex;align-items:flex-end;gap:8px}
.ask .spark{flex:none;height:34px;display:grid;place-items:center;color:var(--accent)}
.ask textarea{flex:1;min-width:0;border:0;background:transparent;resize:none;font:inherit;font-size:14.5px;line-height:20px;color:var(--ink);
  padding:7px 0;max-height:128px;outline:none;user-select:text;-webkit-user-select:text}
.ask textarea::placeholder{color:var(--muted)}
.ask .go{flex:none;width:34px;height:34px;border-radius:10px;display:grid;place-items:center;background:var(--accent);color:#fff}
.ask .go:disabled{opacity:.45;cursor:default}
.ask .msg{margin:2px 34px 4px 30px;font-size:12.5px;line-height:1.4;color:var(--muted)}
.ask .msg[data-kind="err"]{color:var(--danger)}
.ask.busy .spark{animation:askPulse 1.2s ease-in-out infinite}
@keyframes askPulse{50%{opacity:.35}}
@media (prefers-reduced-motion: reduce){ .ask.busy .spark{animation:none} }

@media (max-width:680px){
  .rail{top:auto;bottom:12px;left:50%;transform:translateX(-50%);flex-direction:row;max-width:calc(100% - 24px);overflow-x:auto}
  .rail .sep{width:1px;height:22px;margin:auto 4px}
  .ask{bottom:76px}
  #status{display:none}
  .hide-sm{display:none}
  #boardName{width:clamp(90px,34vw,200px)}
}
@media (prefers-reduced-motion: reduce){ #drawer{transition:none} }
</style>
</head>
<body>
<div id="app">
  <div id="viewport" data-tool="select" aria-label="Canvas">
    <div id="world">
      <div id="frames" class="layer"></div>
      <svg id="links" xmlns="http://www.w3.org/2000/svg"><defs id="defs"></defs><g id="linkG"></g><g id="pvG"></g></svg>
      <div id="items" class="layer"></div>
      <div id="labels" class="layer"></div>
      <div id="sel" class="layer"></div>
    </div>
    <div id="empty" hidden><strong>A blank board</strong>Double-click anywhere to add a note, or pick a tool on the left.</div>
  </div>

  <div class="topbar">
    <div class="pill">
      <button class="ib" id="menuBtn" aria-label="Boards" title="Boards"></button>
      <input id="boardName" aria-label="Board name" spellcheck="false" autocomplete="off">
      <span id="status" role="status" aria-live="polite">Loading boards…</span>
    </div>
    <div class="pill">
      <button class="ib" id="undoBtn" aria-label="Undo" title="Undo (⌘/Ctrl+Z)" disabled></button>
      <button class="ib" id="redoBtn" aria-label="Redo" title="Redo (⌘/Ctrl+Shift+Z)" disabled></button>
      <span class="sep hide-sm"></span>
      <button class="ib hide-sm" id="zoomOut" aria-label="Zoom out" title="Zoom out"></button>
      <button id="zoomPct" title="Fit board to screen (Shift+1)">100%</button>
      <button class="ib hide-sm" id="zoomIn" aria-label="Zoom in" title="Zoom in"></button>
      <span class="sep"></span>
      <button class="ib" id="helpBtn" aria-label="Shortcuts and tips" title="Shortcuts and tips (?)" aria-expanded="false"></button>
    </div>
  </div>

  <nav class="rail" id="rail" aria-label="Tools"></nav>
  <div id="ctx" hidden role="toolbar" aria-label="Selection"></div>
  <form class="ask" id="ask" hidden>
    <p class="msg" id="askMsg" role="status" aria-live="polite" hidden></p>
    <div class="row">
      <span class="spark" id="askSpark" aria-hidden="true"></span>
      <textarea id="askIn" rows="1" aria-label="Ask Claude to edit this board" placeholder="Ask Claude to edit this board or add a section…"></textarea>
      <button type="submit" class="go" id="askGo" aria-label="Send to Claude" title="Send (Enter)"></button>
    </div>
  </form>

  <div id="help" hidden>
    <h3>Shortcuts and tips</h3>
    <dl id="helpList"></dl>
  </div>

  <div id="scrim" hidden></div>
  <aside id="drawer" aria-label="Boards" aria-hidden="true">
    <div class="dh"><h2>Boards</h2><button class="ib" id="drawerClose" aria-label="Close boards"></button></div>
    <button class="newbtn" id="newBoardBtn" aria-expanded="false">New board</button>
    <div class="tpls" id="tpls" hidden>
      <button class="tpl ai" id="genOpen"><b>Generate with Claude</b><span>Describe a board and Claude lays it out.</span></button>
      <button class="tpl" data-new="blank"><b>Blank</b><span>An empty canvas.</span></button>
      <button class="tpl" data-new="problem"><b>Problem breakdown</b><span>Problem, who it affects, causes, ideas, next steps.</span></button>
      <button class="tpl" data-new="health"><b>Health site restyler</b><span>The project plan from our conversation, as a map.</span></button>
    </div>
    <form class="gen" id="gen" hidden>
      <textarea id="genPrompt" aria-label="Describe the board" placeholder="e.g. Plan a product launch for a budgeting app: audience, channels, timeline, risks"></textarea>
      <p class="msg" id="genMsg" role="status" aria-live="polite">Uses the Claude Code account on this computer.</p>
      <div class="row"><button type="button" class="cancel" id="genCancel">Cancel</button><button type="submit" class="go" id="genGo">Generate</button></div>
    </form>
    <ul class="blist" id="blist"></ul>
    <div class="df">
      <button id="importBtn"><span class="ic-up"></span>Import a board</button>
      <button id="exportBtn"><span class="ic-down"></span>Export this board</button>
      <p class="note" id="storeNote"></p>
    </div>
    <input type="file" id="fileIn" accept="application/json,.json" hidden>
  </aside>
</div>

<script>
(() => {
'use strict';
const $ = (s, r = document) => r.querySelector(s);
const vp = $('#viewport'), world = $('#world');
const L = { frames: $('#frames'), items: $('#items'), labels: $('#labels'), sel: $('#sel') };
const linkG = $('#linkG'), pvG = $('#pvG');
const ctxEl = $('#ctx'), statusEl = $('#status'), nameEl = $('#boardName'), zoomEl = $('#zoomPct'), emptyEl = $('#empty');

/* ---------- constants ---------- */
const P = {
  select:'<path d="M5.5 3.5 19 10.2l-6.1 1.9-2.2 6.4z"/>',
  hand:'<path d="M8 13V5.8a1.5 1.5 0 0 1 3 0V12m0-7.2a1.5 1.5 0 0 1 3 0V12m0-5.2a1.5 1.5 0 0 1 3 0V14a6 6 0 0 1-6 6h-.6a6 6 0 0 1-4.7-2.3l-2.1-2.8a1.5 1.5 0 0 1 2.3-1.9L8 14.8"/>',
  note:'<path d="M5 4h14v10l-6 6H5z"/><path d="M13 20v-6h6"/>',
  text:'<path d="M5 7V4.5h14V7M12 4.5v15M9 19.5h6"/>',
  rect:'<rect x="3.5" y="6" width="17" height="12" rx="2.5"/>',

/* ---------- contextual toolbar ---------- */
let ctxSig = '';
function renderCtx(){

  const all = [...its, ...lks];

  const sizable = its.filter(i => i.type !== 'frame' && i.type !== 'pen');

    }

      `<button class="ib" data-act="front" title="Bring to front" aria-label="Bring to front">${ic('front')}</button>` +
      `<button class="ib" data-act="back" title="Send to back" aria-label="Send to back">${ic('back')}</button>`;

  let b;

  const tl = toClient(b.x, b.y), br = toClient(b.x + b.w, b.y + b.h);

  const floor = $('#ask').hidden ? r.bottom - 70 : $('#ask').getBoundingClientRect().top - 12;
  y = clamp(y, r.top + 62, Math.max(r.top + 62, floor - ch));

}
ctxEl.addEventListener('click', e => {
  const b = e.target.closest('[data-act]'); if (!b || !board) return;
  const act = b.dataset.act, v = b.dataset.v, its = selItems(), lks = selLinks();
  if (act === 'del'){ deleteSel(); return; }
  if (act === 'dup'){ duplicate(); return; }
  commit();
  if (act === 'color'){ its.forEach(i => i.color = v); lks.forEach(l => l.color = v); }
  else if (act === 'fs'){ its.forEach(i => { if (i.type !== 'frame' && i.type !== 'pen') i.fs = v; }); }
  else if (act === 'arrow'){ const on = !lks.every(l => l.arrow !== false); lks.forEach(l => l.arrow = on); }
  else if (act === 'dashed'){ const on = !lks.every(l => l.dashed); lks.forEach(l => l.dashed = on); }
  else if (act === 'curve'){
    const on = !lks.every(l => l.bend);
    lks.forEach(l => { const f = bendFrame(l); l.bend = on && f ? Math.round(clamp(Math.hypot(f.c2.x - f.c1.x, f.c2.y - f.c1.y) * 0.2, 30, 160)) : 0; });
  }
  else if (act === 'front'){ let z = maxZ(); [...its].sort((a, b) => a.z - b.z).forEach(i => i.z = ++z); }
  else if (act === 'back'){ let z = minZ() - its.length; [...its].sort((a, b) => a.z - b.z).forEach(i => i.z = z++); }

/* ---------- item operations ---------- */
function addItem(type, r, extra = {}){
  const d = DEF[type] || {};
  const it = { id:uid('i'), type, x:Math.round(r.x), y:Math.round(r.y), w:Math.round(r.w), h:Math.round(r.h),
    text:'', color:d.color || 'graphite', fs:d.fs || 'm', z:maxZ() + 1, ...extra };
  board.items.push(it); return it;
}
function addLink(fromId, toId, extra = {}){
  const l = { id:uid('l'), from:{ id:fromId }, to:{ id:toId }, arrow:true, dashed:false, color:'graphite', label:'', ...extra };
  board.links.push(l); return l;
}
function deleteSel(){
  if (!sel.size) return;
  commit();
  const gone = new Set([...sel].filter(id => byId(id)));
  board.items = board.items.filter(i => !gone.has(i.id));
  board.links = board.links.filter(l => !sel.has(l.id) && !gone.has(l.from.id) && !gone.has(l.to.id));
  sel.clear(); changed();
}
function copyData(){
  const its = selItems(); if (!its.length) return null;
  const ids = new Set(its.map(i => i.id));
  for (const f of its.filter(i => i.type === 'frame')) for (const c of board.items) if (c.type !== 'frame' && contains(f, c)) ids.add(c.id);
  const items = board.items.filter(i => ids.has(i.id));
  const links = board.links.filter(l => l.from.id && l.to.id && ids.has(l.from.id) && ids.has(l.to.id));
  return JSON.parse(JSON.stringify({ items, links }));
}
function pasteData(data, off){
  if (!data) return;
  commit();
  const map = {}; let z = maxZ();
  const newIds = [];
  for (const it of [...data.items].sort((a, b) => a.z - b.z)){
    const n = { ...it, id:uid('i'), x:it.x + off, y:it.y + off, z:++z };
    if (it.pts) n.pts = [...it.pts];
    map[it.id] = n.id; board.items.push(n); newIds.push(n.id);
  }
  for (const l of data.links) board.links.push({ ...l, id:uid('l'), from:{ id:map[l.from.id] }, to:{ id:map[l.to.id] } });

}
function duplicate(){ pasteData(copyData(), 30); }
function copySel(){ clip = copyData(); pasteN = 0; }
function paste(){ if (!clip) return; pasteN++; pasteData(clip, 30 * pasteN); }

/* ---------- editing ---------- */
function setEditable(el){ try { el.contentEditable = 'plaintext-only'; } catch {} if (el.contentEditable !== 'plaintext-only') el.contentEditable = 'true'; }

function onPastePlain(e){

  document.execCommand('insertText', false, t);
}
function startEdit(id, fresh = false){
  const it = byId(id); if (!it || it.type === 'pen') return;
  finishEdit();
  sel = new Set([id]);
  const el = elMap.get(id); if (!el) return;
  const t = el.querySelector('.t');
  editing = { id, kind:'item', el:t, before:it.text || '', fresh };
  t.textContent = it.text || ''; t._src = null;
  el.classList.add('editing');
  setEditable(t);
  t.addEventListener('paste', onPastePlain);
  t.addEventListener('blur', finishEdit, { once:true });
  render();
  t.focus({ preventScroll:true }); selectAll(t);
}
function startLinkEdit(id){
  const l = linkById(id); if (!l) return;
  finishEdit();
  sel = new Set([id]);
  pendingLabel = id; render(); pendingLabel = null;
  const el = lblMap.get(id); if (!el) return;
  editing = { id, kind:'link', el, before:l.label || '', fresh:false };
  el.classList.add('editing');
  setEditable(el);
  el.addEventListener('paste', onPastePlain);
  el.addEventListener('blur', finishEdit, { once:true });
  render();
  el.focus({ preventScroll:true }); selectAll(el);
}
function finishEdit(){
  if (!editing) return;
  const ed = editing; editing = null;
  const txt = ed.el.innerText.replace(/\n+$/, '');
  ed.el.removeAttribute('contenteditable');
  ed.el.removeEventListener('paste', onPastePlain);
  if (ed.kind === 'item'){
    const it = byId(ed.id);
    const el = elMap.get(ed.id); if (el) el.classList.remove('editing');
    if (it){
      if (ed.fresh && it.type === 'text' && !txt.trim()){
        board.items = board.items.filter(i => i !== it); sel.delete(it.id); past.pop();
      } else if (txt !== ed.before){ if (!ed.fresh) commit(); it.text = txt; }
      scheduleSave();
    }
  } else {
    ed.el.classList.remove('editing');
    const l = linkById(ed.id);
    if (l && txt !== ed.before){ commit(); l.label = txt.trim(); scheduleSave(); }
  }
  const s = window.getSelection(); if (s) s.removeAllRanges();
  render(); updateUndo();
}

/* ---------- tools ---------- */
function setTool(t){

}
function buildChrome(){
  $('#rail').innerHTML = TOOLS.map(t => t ? `<button class="tb" data-tool="${t[0]}" aria-pressed="${t[0] === 'select'}" aria-label="${t[1]} (${t[2]})" title="${t[1]} (${t[2]})">${ic(t[0], 20)}</button>` : '<span class="sep"></span>').join('');
  $('#rail').addEventListener('click', e => { const b = e.target.closest('.tb'); if (b){ finishEdit(); setTool(b.dataset.tool); } });
  $('#menuBtn').innerHTML = ic('menu'); $('#undoBtn').innerHTML = ic('undo'); $('#redoBtn').innerHTML = ic('redo');
  $('#zoomOut').innerHTML = ic('minus'); $('#zoomIn').innerHTML = ic('plus'); $('#helpBtn').innerHTML = ic('help');
  $('#drawerClose').innerHTML = ic('close');
  $('#askSpark').innerHTML = ic('sparkle', 18); $('#askGo').innerHTML = ic('send', 18);
  $('.ic-up').outerHTML = ic('up', 16); $('.ic-down').outerHTML = ic('down', 16);
  $('#helpList').innerHTML = HELP.map(([k, v]) => `<dt>${esc(k)}</dt><dd>${esc(v)}</dd>`).join('');
  $('#undoBtn').onclick = undo; $('#redoBtn').onclick = redo;

function toggleHelp(){ const h = $('#help'); h.hidden = !h.hidden; $('#helpBtn').setAttribute('aria-expanded', !h.hidden); }

/* ---------- pointer interaction ---------- */
const pointers = new Map();
let lastDown = { t:0, x:0, y:0 };
function startMove(p, e, clickedId){
  const orig = new Map();
  for (const it of selItems()){
    orig.set(it.id, { x:it.x, y:it.y });
    if (it.type === 'frame') for (const c of board.items) if (c.type !== 'frame' && !orig.has(c.id) && contains(it, c)) orig.set(c.id, { x:c.x, y:c.y });
  }
  return { kind:'move', p0:p, orig, sx:e.clientX, sy:e.clientY, moved:false, clickedId };
}
function handleDbl(target, p){
  const lk = target.closest('[data-link]'), itEl = target.closest('.item'), bd = target.closest('[data-bend]');
  if (bd){ const l = linkById(bd.dataset.bend); if (l && l.bend){ commit(); l.bend = 0; changed(); } return; }
  if (lk){ startLinkEdit(lk.dataset.link); return; }
  if (itEl && itEl.dataset.type !== 'pen'){ startEdit(itEl.dataset.id); return; }
  if (!itEl){
    commit();
    const d = DEF.note;
    const it = addItem('note', { x:p.x - d.w / 2, y:p.y - d.h / 2, w:d.w, h:d.h });
    sel = new Set([it.id]); render(); scheduleSave(); startEdit(it.id, true);
  }
}
vp.addEventListener('pointerdown', e => {
  if (!board) return;
  if (editing){ if (editing.el.contains(e.target)) return; finishEdit(); }
  e.preventDefault();
  const ae = document.activeElement; if (ae && ae !== document.body && ae.blur) ae.blur();
  if (!$('#help').hidden && e.button === 0) toggleHelp();
  pointers.set(e.pointerId, { x:e.clientX, y:e.clientY });
  if (pointers.size === 2){
    const [a, b] = [...pointers.values()];
    op = { kind:'pinch', d0:Math.max(dist(a, b), 1), c0:mid(a, b), v0:{ ...board.view } }; render(); return;
  }
  if (pointers.size > 2) return;
  try { vp.setPointerCapture(e.pointerId); } catch {}
  const now = performance.now();
  const dbl = now - lastDown.t < 380 && Math.hypot(e.clientX - lastDown.x, e.clientY - lastDown.y) < 10;
  lastDown = { t:dbl ? 0 : now, x:e.clientX, y:e.clientY };
  const p = toWorld(e.clientX, e.clientY), target = e.target;
  const startPan = () => { op = { kind:'pan', sx:e.clientX, sy:e.clientY, v0:{ ...board.view } }; vp.classList.add('panning'); };
  if (e.button === 1 || spaceDown || tool === 'hand'){ e.preventDefault(); startPan(); return; }
  if (e.button !== 0){ pointers.delete(e.pointerId); return; }
  if (dbl && tool === 'select'){ op = null; handleDbl(target, p); return; }

  if (tool === 'pen'){ op = { kind:'pen', pts:[p] }; render(); return; }
  if (DEF[tool] && tool !== 'pen'){ op = { kind:'create', type:tool, p0:p, cur:p }; render(); return; }
  if (tool === 'connector'){ const s = itemAt(p); op = { kind:'link', from:s ? s.id : null, p0:p, cur:p }; render(); return; }

  const hd = target.closest('[data-handle]'), port = target.closest('[data-port]'), bd = target.closest('[data-bend]');
  const itEl = target.closest('.item'), lkEl = target.closest('[data-link]');
  if (bd){
    const l = linkById(bd.dataset.bend), f = l && bendFrame(l);
    op = f ? { kind:'bend', id:l.id, b0:l.bend || 0, p0:p, nx:f.nx, ny:f.ny, committed:false } : { kind:'none' };
  } else if (hd){
    const its = selItems();
    op = { kind:'resize', corner:hd.dataset.handle, b0:bboxOf(its), orig:JSON.parse(JSON.stringify(its)), committed:false };
  } else if (port){
    op = { kind:'port', from:selItems()[0].id, side:port.dataset.port, p0:p, cur:p, sx:e.clientX, sy:e.clientY, moved:false };
  } else if (itEl){
    const id = itEl.dataset.id;

    else { const was = sel.has(id); if (!was) sel = new Set([id]); op = startMove(p, e, was ? id : null); op.link = target.closest('a.lnk'); }
  } else if (lkEl){
    const id = lkEl.dataset.link;

});
vp.addEventListener('pointermove', e => {
  if (pointers.has(e.pointerId)) pointers.set(e.pointerId, { x:e.clientX, y:e.clientY });
  if (!op || !board) return;
  if (op.kind === 'pinch'){
    if (pointers.size < 2) return;
    const [a, b] = [...pointers.values()], r = rectVP(), c = mid(a, b), v0 = op.v0;
    const nz = clamp(v0.z * dist(a, b) / op.d0, 0.1, 4);
    const wx = (op.c0.x - r.left - v0.x) / v0.z, wy = (op.c0.y - r.top - v0.y) / v0.z;
    board.view = { z:nz, x:c.x - r.left - wx * nz, y:c.y - r.top - wy * nz };
    render(); return;
  }
  const p = toWorld(e.clientX, e.clientY);
  switch (op.kind){
    case 'pan':
      board.view.x = op.v0.x + (e.clientX - op.sx); board.view.y = op.v0.y + (e.clientY - op.sy); render(); break;
    case 'move': {
      if (!op.moved){ if (Math.hypot(e.clientX - op.sx, e.clientY - op.sy) < 3) return; op.moved = true; commit(); }
      const dx = Math.round(p.x - op.p0.x), dy = Math.round(p.y - op.p0.y);
      for (const [id, o] of op.orig){ const it = byId(id); if (it){ it.x = o.x + dx; it.y = o.y + dy; } }
      render(); break;
    }
    case 'resize': {
      if (!op.committed){ commit(); op.committed = true; }
      const b = op.b0, c = op.corner;
      let x1 = b.x, y1 = b.y, x2 = b.x + b.w, y2 = b.y + b.h;
      if (c.includes('w')) x1 = Math.min(p.x, x2 - 20);
      if (c.includes('e')) x2 = Math.max(p.x, x1 + 20);
      if (c.includes('n')) y1 = Math.min(p.y, y2 - 20);
      if (c.includes('s')) y2 = Math.max(p.y, y1 + 20);
      let sx = (x2 - x1) / Math.max(b.w, 1), sy = (y2 - y1) / Math.max(b.h, 1);
      if (e.shiftKey){ const s = Math.max(sx, sy); sx = sy = s; if (c.includes('w')) x1 = x2 - b.w * s; else x2 = x1 + b.w * s; if (c.includes('n')) y1 = y2 - b.h * s; else y2 = y1 + b.h * s; }
      for (const o of op.orig){
        const it = byId(o.id); if (!it) continue;
        it.x = Math.round(x1 + (o.x - b.x) * sx); it.y = Math.round(y1 + (o.y - b.y) * sy);
        it.w = Math.max(16, Math.round(o.w * sx)); it.h = Math.max(16, Math.round(o.h * sy));

    }
    case 'marquee': {

    }
    case 'bend': {

      const b = op.b0 + (p.x - op.p0.x) * op.nx + (p.y - op.p0.y) * op.ny;

});
function endPointer(e){
  pointers.delete(e.pointerId);

  const o = op; op = null; vp.classList.remove('panning');
  switch (o.kind){
    case 'pan': scheduleSave(1500, true); break;
    case 'move':
      if (o.moved) scheduleSave();
      else if (o.link && !e.shiftKey) window.open(o.link.href, '_blank', 'noopener');
      else if (o.clickedId && sel.size > 1 && !e.shiftKey) sel = new Set([o.clickedId]);
      break;
    case 'resize': case 'bend': if (o.committed) scheduleSave(); break;
    case 'create': finishCreate(o); break;

function finishPen(o){

  const xs = o.pts.map(p => p.x), ys = o.pts.map(p => p.y);
  const x = Math.min(...xs), y = Math.min(...ys);
  const pts = []; for (const p of o.pts) pts.push(+(p.x - x).toFixed(1), +(p.y - y).toFixed(1));
  commit();
  addItem('pen', { x, y, w:Math.max(Math.max(...xs) - x, 1), h:Math.max(Math.max(...ys) - y, 1) }, { pts, sw:3, color:DEF.pen.color, fs:'m' });

function finishLink(o){
  const target = itemAt(o.cur, o.from);
  if (!o.from && !target && dist(o.p0, o.cur) < 10) return;
  if (o.from && target && target.id === o.from) return;
  if (!o.from && dist(o.p0, o.cur) < 10) return;
  commit();
  const l = { id:uid('l'), from:o.from ? { id:o.from } : { x:o.p0.x, y:o.p0.y }, to:target ? { id:target.id } : { x:o.cur.x, y:o.cur.y },

  const type = ['note', 'rect', 'ellipse', 'diamond'].includes(src.type) ? src.type : 'note';

function finishPort(o){

    const t = itemAt(o.cur, src.id);

  }
  const s = spawnFrom(src);
  let x, y;
  if (o.moved){ x = o.cur.x - s.w / 2; y = o.cur.y - s.h / 2; }
  else {
    const gap = 90, cx = src.x + src.w / 2, cy = src.y + src.h / 2;

  }
  commit();
  const it = addItem(s.type, { x, y, w:s.w, h:s.h }, { color:s.color, fs:s.fs });

async function flush(){

  saving = true;
  try {
    while (dirty){
      dirty = false;
      const b = board, data = serialize(b);
      if (Store.mode === 'db' && JSON.stringify(data).length > 240000){
        setStatus('This board is too large to save. Export a copy or split it into two boards.', 'err'); saving = false; return;
      }
      await Store.setBoard(b.id, data);
      const entry = index.find(x => x.id === b.id);
      if (entry){
        const renamed = entry.name !== b.name;
        entry.name = b.name; entry.updated = data.updated;
        if (renamed || Date.now() - lastIndexWrite > 30000){ await Store.setIndex(index); lastIndexWrite = Date.now(); if (renamed) renderDrawer(); }
      }
    }
    setStatus(savedLabel());
  } catch (err){

const GEN_SHAPE = { note:[200, 140], rect:[200, 120], ellipse:[200, 130], diamond:[200, 150] };
// Turns Claude's structured answer (sections of short items, plus links) into positioned frames and notes.
function layoutGenerated(g){

  const cols = Math.min(3, Math.max(1, sections.length)), fw = 480, gapX = 120, gapY = 130, cell = 170;
  const ids = {};
  if (str(g.title)) t.text(0, -170, cols * (fw + gapX) - gapX, str(g.title), 'xl');
  if (str(g.subtitle)) t.text(0, -108, cols * (fw + gapX) - gapX, str(g.subtitle), 'm');
  let y = 0;
  for (let r = 0; r < sections.length; r += cols){
    const row = sections.slice(r, r + cols);
    const fh = Math.max(...row.map(s => 60 + Math.ceil(Math.min(s.items.length, 8) / 2) * cell));
    row.forEach((s, c) => {

      if (str(s.id)) ids[str(s.id)] = f;

        const text = str(it && it.text); if (!text) return;
        const type = SHAPE[it.shape] ? it.shape : 'note', [w, h] = SHAPE[type];

        n.type = type;
        if (str(it.id) && !ids[str(it.id)]) ids[str(it.id)] = n;

  for (const l of Array.isArray(g.links) ? g.links : []){

    if (!a || !b || a === b || seen.has(key)) continue;
    seen.add(key); t.link(a, b, { dashed:!!l.dashed, label:str(l.label).slice(0, 40) });

}

// The smallest frame that fully contains an item is its section.
function sectionOf(it){
  let best = null;

  const frames = board.items.filter(i => i.type === 'frame').sort(readingOrder);
  const sec = new Map(frames.map(f => [f.id, { id:f.id, title:f.text || '', color:f.color, items:[] }]));

  for (let i = 0; i < 400; i++){
    const x = f.x + 30 + (i % cols) * 220, y = f.y + 40 + Math.floor(i / cols) * 170, slot = { x, y, w:200, h:150 };
    if (board.items.some(o => o !== f && o.type !== 'frame' && o.type !== 'pen' && intersects(o, slot))) continue;
    if (y + 170 > f.y + f.h) growFrame(f, y + 170 - (f.y + f.h));
    return addItem(type, { x, y:y + (150 - h) / 2, w, h }, { text, color, fs:text.length > 70 ? 's' : 'm' });
  }
  return null;
}
// New sections go in a row (three per row) under everything already on the board.
function addSections(list, ids){
  const out = [], fw = 480, gapX = 120, gapY = 130, cell = 170;
  const frames = board.items.filter(i => i.type === 'frame'), all = bboxOf(board.items);
  const x0 = frames.length ? bboxOf(frames).x : all.x;
  let y = board.items.length ? all.y + all.h + gapY + 40 : 0;
  const secs = list.filter(s => s && askStr(s.title)).slice(0, 6);
  for (let r = 0; r < secs.length; r += 3){
    const row = secs.slice(r, r + 3);
    const fh = Math.max(...row.map(s => 60 + Math.ceil(Math.max(1, Math.min(askArr(s.items).length, 8)) / 2) * cell));
    row.forEach((s, c) => {
      const x = x0 + c * (fw + gapX), sc = COLORS[s.color] ? s.color : 'butter';
      const f = addItem('frame', { x, y, w:fw, h:fh }, { text:askStr(s.title), color:'graphite' });
      out.push(f); if (askStr(s.id)) ids[askStr(s.id)] = f;
      askArr(s.items).slice(0, 8).forEach(it => {
        if (!it || !askStr(it.text)) return;
        const n = placeInFrame(f, it, COLORS[it.color] ? it.color : sc);
        if (n){ out.push(n); if (askStr(it.id) && !ids[askStr(it.id)]) ids[askStr(it.id)] = n; }
      });
    });
    y += fh + gapY;
  }
  return out;
}
function applyChanges(c){
  const keepFuture = future;
  commit();
  const ids = {}, touched = new Set(), ref = id => byId(askStr(id)) || ids[askStr(id)];
  let n = 0;
  const name = askStr(c.rename_board).slice(0, 80);
  if (name && name !== board.name){ board.name = name; nameEl.value = name; document.title = name + ' | Mapboard'; n++; }
  // Deleting a section also deletes the notes inside it.
  const gone = new Set(), goneLinks = new Set(askArr(c.delete_links).map(askStr).filter(id => linkById(id)));
  for (const id of askArr(c.delete_items)){
    const it = byId(askStr(id)); if (!it) continue;
    gone.add(it.id);
    if (it.type === 'frame') for (const o of board.items) if (o.type !== 'frame' && sectionOf(o) === it) gone.add(o.id);
  }
  if (gone.size || goneLinks.size){
    board.items = board.items.filter(i => !gone.has(i.id));
    board.links = board.links.filter(l => !goneLinks.has(l.id) && !gone.has(l.from.id) && !gone.has(l.to.id));
    n += gone.size + goneLinks.size;
  }
  for (const u of askArr(c.update_items)){
    const it = u && byId(askStr(u.id)); if (!it) continue;
    if (askStr(u.text) && it.type !== 'pen') it.text = askStr(u.text);
    if (COLORS[u.color]) it.color = u.color;
    touched.add(it.id); n++;
  }
  for (const a of askArr(c.add_items)){
    const f = a && byId(askStr(a.section));
    if (!f || f.type !== 'frame' || !askStr(a.text)) continue;
    const sib = board.items.find(o => o.type === 'note' && sectionOf(o) === f);
    const it = placeInFrame(f, a, COLORS[a.color] ? a.color : (sib ? sib.color : 'butter'));
    if (it){ touched.add(it.id); n++; if (askStr(a.id)) ids[askStr(a.id)] = it; }
  }
  for (const it of addSections(askArr(c.add_sections), ids)){ touched.add(it.id); n++; }
  for (const l of askArr(c.add_links)){
    const a = l && ref(l.from), b = l && ref(l.to);
    if (!a || !b || a === b || board.links.some(x => x.from.id === a.id && x.to.id === b.id)) continue;
    addLink(a.id, b.id, { dashed:!!l.dashed, label:askStr(l.label).slice(0, 40) }); n++;
  }
  if (!n){ past.pop(); future = keepFuture; updateUndo(); return 0; }
  sel = new Set([...touched].filter(id => byId(id)));
  changed();
  reveal(selItems());
  return n;
}
// Brings items into view if any part of them is off screen, zooming out only as far as needed.
function reveal(its){
  if (!its.length) return;
  const b = bboxOf(its), r = rectVP(), v = board.view;
  const tl = toClient(b.x, b.y - 40), br = toClient(b.x + b.w, b.y + b.h);
  const bar = $('#ask').getBoundingClientRect();
  if (tl.x >= r.left + 70 && tl.y >= r.top + 70 && br.x <= r.right - 10 && br.y <= bar.top - 10) return;
  const z = clamp(Math.min(v.z, (r.width - 180) / Math.max(b.w, 1), (r.height - 260) / Math.max(b.h + 40, 1)), 0.1, 4);
  board.view = { z, x:r.width / 2 - (b.x + b.w / 2) * z, y:(r.height - 80) / 2 - (b.y - 20 + b.h / 2) * z };
  viewChanged();
}
$('#askIn').addEventListener('input', () => { askFit(); if (!askBusy && !$('#askMsg').hidden) askMsg(''); });
$('#askIn').addEventListener('focus', askPlaceholder);
$('#askIn').addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey && !e.isComposing){ e.preventDefault(); $('#ask').requestSubmit(); }
  // With nothing typed, undo/redo act on the board, so "Undo with ⌘/Ctrl+Z" works right after Claude's change.
  else if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'z' && !e.target.value){ e.preventDefault(); e.shiftKey ? redo() : undo(); }
  else if (e.key === 'Escape'){ e.preventDefault(); e.target.blur(); }
});
$('#ask').addEventListener('submit', async e => {
  e.preventDefault();
  const prompt = $('#askIn').value.trim();
  if (!prompt || askBusy || !board) return;
  finishEdit();
  const boardId = board.id, selected = selItems().map(i => i.id);
  askBusy = true; $('#ask').classList.add('busy'); $('#askGo').disabled = true; $('#askIn').readOnly = true;
  askMsg('Claude is working on it. This usually takes 20 to 60 seconds…');
  try {
    let res;
    try { res = await fetch('api/edit', { method:'POST', headers:{ 'Content-Type':'application/json' }, body:JSON.stringify({ prompt, board:describeBoard(), selected }) }); }
    catch { throw new Error('Asking Claude needs the Mapboard server. Start it with "make start".'); }
    const body = await res.json().catch(() => null);
    if (!body) throw new Error('Asking Claude needs the Mapboard server. Start it with "make start".');
    if (!res.ok || !body.changes) throw new Error(body.error || "Claude couldn't edit the board.");
    if (!board || board.id !== boardId) throw new Error("You switched boards, so Claude's changes weren't applied.");
    const summary = askStr(body.changes.summary);
    if (applyChanges(body.changes)){
      $('#askIn').value = ''; askFit();
      askMsg((summary || 'Done.') + ' Undo with ⌘/Ctrl+Z.');
    } else askMsg(summary || 'Claude didn’t change anything. Try rephrasing your request.', 'err');
  } catch (err){ askMsg(err.message, 'err'); }
  finally { askBusy = false; $('#ask').classList.remove('busy'); $('#askGo').disabled = false; $('#askIn').readOnly = false; }
});
let delArm = null;
$('#blist').addEventListener('click', e => {
  const o = e.target.closest('[data-open]'), d = e.target.closest('[data-del]');
  if (o){ closeDrawer(); if (!board || o.dataset.open !== board.id) openBoard(o.dataset.open); return; }
  if (d){
    if (delArm === d){ delArm = null; deleteBoard(d.dataset.del); return; }
    if (delArm){ delArm.classList.remove('confirm'); delArm.innerHTML = ic('trash', 16); }
    delArm = d; d.classList.add('confirm'); d.textContent = 'Delete?';
    setTimeout(() => { if (delArm === d){ delArm = null; d.classList.remove('confirm'); d.innerHTML = ic('trash', 16); } }, 3000);
  }
});
nameEl.addEventListener('input', () => { if (!board) return; board.name = nameEl.value.trim() || 'Untitled board'; document.title = board.name + ' | Mapboard'; scheduleSave(800); });
nameEl.addEventListener('blur', () => { if (board) nameEl.value = board.name; });

$('#exportBtn').addEventListener('click', async () => {
  if (!board) return;
  const data = { format:'mapboard', version:1, name:board.name, items:board.items, links:board.links };
  const slug = (board.name || 'board').toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '') || 'board';
  const text = JSON.stringify(data, null, 2), filename = slug + '.json';
  if (downloadsCap){
    try { await downloadsCap.save({ filename, data:text }); }
    catch (e){ if (!e || e.code !== 'declined') setStatus("Couldn't export the board.", 'err'); }
    return;
  }
  const url = URL.createObjectURL(new Blob([text], { type:'application/json' }));
  const a = document.createElement('a'); a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
});
$('#importBtn').addEventListener('click', () => $('#fileIn').click());
$('#fileIn').addEventListener('change', async e => {
  const f = e.target.files[0]; e.target.value = '';
  if (!f) return;
  try {
    const d = JSON.parse(await f.text());
    if (!d || !Array.isArray(d.items)) throw 0;
    const num = v => (typeof v === 'number' && isFinite(v)) ? v : 0;
    const items = d.items.filter(i => i && typeof i.id === 'string' && (DEF[i.type])).map(i => ({
      id:i.id, type:i.type, x:num(i.x), y:num(i.y), w:Math.max(num(i.w), 1), h:Math.max(num(i.h), 1),
      text:typeof i.text === 'string' ? i.text : '', color:COLORS[i.color] ? i.color : 'graphite', fs:FS[i.fs] ? i.fs : 'm', z:num(i.z),
      ...(i.type === 'pen' && Array.isArray(i.pts) ? { pts:i.pts.map(num), sw:num(i.sw) || 3 } : {})
    }));
    const ids = new Set(items.map(i => i.id));
    const end = x => x && typeof x.id === 'string' ? (ids.has(x.id) ? { id:x.id } : null) : (x ? { x:num(x.x), y:num(x.y) } : null);
    const links = (Array.isArray(d.links) ? d.links : []).map(l => ({
      id:typeof l.id === 'string' ? l.id : uid('l'), from:end(l.from), to:end(l.to), arrow:l.arrow !== false, dashed:!!l.dashed, bend:num(l.bend),
      color:COLORS[l.color] ? l.color : 'graphite', label:typeof l.label === 'string' ? l.label : ''
    })).filter(l => l.from && l.to);
    await createBoard(null, { name:(typeof d.name === 'string' && d.name.trim()) || f.name.replace(/\.json$/i, ''), items, links });
  } catch { setStatus("That file isn't a Mapboard export.", 'err'); }
});

/* ---------- templates ---------- */
function T(){
  const items = [], links = [];
  const add = o => { const it = { id:uid('i'), text:'', color:'graphite', fs:'m', ...o, z:items.length + 1 }; items.push(it); return it; };
  return {
    items, links,
    frame:(x, y, w, h, text, color = 'graphite') => add({ type:'frame', x, y, w, h, text, color }),
    note:(x, y, text, color = 'butter', w = 200, h = 140, fs = 'm') => add({ type:'note', x, y, w, h, text, color, fs }),
    text:(x, y, w, text, fs = 'xl', h = 50) => add({ type:'text', x, y, w, h, text, fs }),
    link:(a, b, o = {}) => { links.push({ id:uid('l'), from:{ id:a.id }, to:{ id:b.id }, arrow:true, dashed:false, color:'graphite', label:'', ...o }); }
  };
}
const TEMPLATES = {
  blank: () => ({ name:'Untitled board', items:[], links:[] }),
  problem: () => {
    const t = T();
    t.text(0, -150, 1900, 'What problem are we solving?', 'xl');
    const cols = [['The problem', 'Describe the problem in one sentence.', 'rose'], ['Who it affects', 'Who feels this most, and when?', 'sky'],
      ['Why it happens', 'List the causes you can see.', 'apricot'], ['Ideas', 'Any idea goes. Sort them later.', 'butter'],
      ['Next steps', 'What is the smallest thing to try first?', 'mint']];
    let prev = null;
    cols.forEach(([title, prompt, color], i) => {
      const f = t.frame(i * 400, 0, 340, 420, title);
      t.note(i * 400 + 30, 40, prompt, color, 280, 130, 'm');
      if (prev) t.link(prev, f);
      prev = f;
    });
    return { name:'Problem breakdown', items:t.items, links:t.links };
  },
  health: () => {
    const t = T(), fw = 480, fh = 390;
    const block = (x, y, title, notes, color) => {
      const f = t.frame(x, y, fw, fh, title);
      notes.forEach((n, i) => t.note(x + 30 + (i % 2) * 220, y + 40 + Math.floor(i / 2) * 170, n[0], n[1] || color));
      return f;
    };
    t.text(0, -170, 1680, 'Health site restyler', 'xl');
    t.text(0, -108, 1680, 'Consistent, accessible pages across Scottish health websites, delivered by one injected script.', 'm');
    const goal = t.note(-340, 100, 'Goal: patients get the same clear experience on every GP, dental and board site', 'butter', 220, 190, 'm');
    const p1 = block(0, 0, 'Phase 1: Restyle', [
      ['Rule generator: Playwright crawl + Claude writes selector rules'], ['Runtime script applies stored rules, with no AI at page load'],
      ['Fail open: show the original page if a rule misses'], ['Fidelity check: phones, hours and addresses must match', 'rose']], 'sky');
    const p2 = block(600, 0, 'Phase 2: Keep in sync', [
      ['Daily cron compares a structural fingerprint'], ['Content change: re-validate existing rules'],
      ['Structure change: regenerate rules'], ['Human review queue before publishing', 'butter']], 'lilac');
    const p3 = block(1200, 0, 'Phase 3: Chat', [
      ['Info-only assistant answering from site content'], ['Emergency signposting to 999 and NHS 24 (111)', 'rose'],
      ['Later: structured requests (needs a DPIA)'], ['Never assess symptoms (MHRA medical device rules)', 'rose']], 'mint');
    const gtm = block(0, 520, 'Go to market', [
      ['Pilot with 5 GP and dental practices'], ['Demo with Playwright injection on public pages'],
      ['Hand-written outreach; check PECR first'], ['Watch Public Services Delivery Scotland']], 'apricot');
    const risks = block(600, 520, 'Risks', [
      ['GOV.UK crown, name and font are restricted'], ['Don\u2019t break booking widgets or forms'],
      ['Selectors drift when sites change'], ['The spinner must never leave a blank page']], 'rose');
    const wk = block(1200, 520, 'This weekend', [
      ['Saturday: crawler and rule extraction on one site'], ['Sunday: runtime script, 2 templates, screenshots'],
      ['Run all 5 sites through'], ['Simple review page']], 'butter');
    t.link(goal, p1); t.link(p1, p2); t.link(p2, p3);
    t.link(p1, gtm, { dashed:true, label:'demo material' });
    t.link(p1, wk, { dashed:true, label:'start here' });
    return { name:'Health site restyler', items:t.items, links:t.links };
  }
};

/* ---------- boot ---------- */
async function boot(){
  buildChrome();
  updateStoreNote();
  const [db, user] = await Promise.all([cap('db'), cap('user')]);
  let id = null;
  if (db && user){ try { id = await user.id(); } catch {} }
  if (db && id){ Store.mode = 'db'; Store.db = db; Store.uid = id; }
  try { index = (await Store.getIndex()) || []; }
  catch { Store.mode = 'local'; index = (await Store.getIndex()) || []; }
  updateStoreNote();
  if (Store.mode === 'db' && !index.length){
    for (const b of LS.get('mapboard:index') || []){
      const d = LS.get('mapboard:b:' + b.id);
      if (d){ try { await Store.setBoard(b.id, d); index.push(b); } catch {} }
    }
    if (index.length) await Store.setIndex(index).catch(() => {});
  }
  if (!index.length) await createBoard('health');
  else {
    const last = LS.get('mapboard:last');
    await openBoard(index.some(b => b.id === last) ? last : mostRecent().id);
  }
  cap('downloads').then(d => { downloadsCap = d; });
  fetch('api/health').then(r => r.ok ? r.json() : null).then(h => { if (h && h.ok) $('#ask').hidden = false; }).catch(() => {});
}
boot();
})();
