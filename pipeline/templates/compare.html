<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Compare nursery templates: original and spacious</title>
<style>
  :root { --ink: #1d2433; --muted: #5b6475; --line: #e3e6ec; --bg: #f5f6f8; --accent: #2457c5; }
  * { box-sizing: border-box; }
  body { margin: 0; font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; color: var(--ink); background: var(--bg); }
  header { position: sticky; top: 0; z-index: 2; background: #fff; border-bottom: 1px solid var(--line); padding: 14px 24px; display: flex; flex-wrap: wrap; gap: 12px 24px; align-items: center; }
  h1 { font-size: 18px; margin: 0; }
  .controls { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; }
  label { font-weight: 600; font-size: 14px; }
  select, button { font: inherit; padding: 6px 10px; border: 1px solid #c7ccd6; border-radius: 8px; background: #fff; color: var(--ink); }
  button[aria-pressed="true"] { background: var(--ink); color: #fff; border-color: var(--ink); }
  main { padding: 24px; }
  .pair { background: #fff; border: 1px solid var(--line); border-radius: 14px; padding: 18px 20px 22px; margin: 0 0 28px; }
  .pair h2 { font-size: 17px; margin: 0 0 4px; }
  .pair p { margin: 0 0 14px; color: var(--muted); font-size: 14px; }
  .sides { display: flex; gap: 28px; flex-wrap: wrap; align-items: flex-start; }
  figure { margin: 0; }
  figcaption { font-weight: 600; font-size: 14px; margin: 0 0 8px; display: flex; gap: 10px; align-items: baseline; }
  figcaption a { font-weight: 400; color: var(--accent); }
  .frame { border: 1px solid #c7ccd6; border-radius: 22px; overflow: hidden; background: #fff; box-shadow: 0 6px 24px rgba(20, 30, 50, .08); }
  .frame iframe { display: block; border: 0; }
  .phone .frame iframe { width: 390px; height: 760px; }
  /* Desktop: a 1280px page shown at half size. */
  .desktop .frame { width: 640px; height: 420px; border-radius: 10px; }
  .desktop .frame iframe { width: 1280px; height: 840px; transform: scale(.5); transform-origin: 0 0; }
</style>
</head>
<body>
<header>
  <h1>Original vs spacious</h1>
  <div class="controls">
    <span><label for="page">Page</label> <select id="page">
      <option value="index.html">Home</option>
      <option value="join-us.html">Visit and join</option>
      <option value="fees-and-funding.html">Fees and funding</option>
      <option value="our-nursery.html">Our nursery</option>
      <option value="our-team.html">Our team</option>
      <option value="parents.html">Parents</option>
      <option value="gallery.html">Gallery</option>
    </select></span>
    <span role="group" aria-label="Width"><button type="button" data-view="phone" aria-pressed="true">Phone</button> <button type="button" data-view="desktop" aria-pressed="false">Desktop</button></span>
    <span><label for="only">Template</label> <select id="only"><option value="">All</option></select></span>
  </div>
</header>
<main id="pairs" class="phone"></main>
<script>
  // Each older nursery template next to its spacious version (same example nursery, same facts).
  const PAIRS = [
    ['Front Desk Nursery', 'nursery/front-desk'], ['Key Worker', 'nursery/key-worker'], ['Garden Gate', 'nursery/garden-gate'],
    ['Cut and Stick', 'nursery/cut-and-stick'], ['Full Stop', 'nursery/full-stop'], ['Chapter One', 'nursery/chapter-one'],
    ['Weatherproof', 'nursery/weatherproof'], ['Big Table', 'nursery/big-table'], ['Sidekick', 'nursery/sidekick'],
    ['Make Waves', 'nursery/make-waves'], ['Meadow', 'nursery/meadow']
  ];
  const main = document.getElementById('pairs'), page = document.getElementById('page'), only = document.getElementById('only');
  for (const [name, dir] of PAIRS) only.add(new Option(name, dir));
  function side(label, dir, file){
    const url = `${dir}/example/${file}`;
    return `<figure><figcaption>${label} <a href="${url}" target="_blank" rel="noopener">Open ↗</a></figcaption>
      <div class="frame" data-url="${url}"><iframe src="${url}" title="${label}" loading="lazy"></iframe></div></figure>`;
  }
  // A version or page that doesn't exist yet shows the server's "Not found" in its frame.
  function render(){
    const file = page.value;
    const list = PAIRS.filter(([, d]) => !only.value || d === only.value);
    main.innerHTML = list.map(([name, dir]) => `<section class="pair"><h2>${name}</h2><p>${dir} and ${dir}-spacious</p>
      <div class="sides">${side('Original', dir, file)}${side('Spacious', dir + '-spacious', file)}</div></section>`).join('');
  }
  page.addEventListener('change', render);
  only.addEventListener('change', render);
  for (const b of document.querySelectorAll('[data-view]')) b.addEventListener('click', () => {
    for (const x of document.querySelectorAll('[data-view]')) x.setAttribute('aria-pressed', x === b);
    main.className = b.dataset.view;
  });
  render();
</script>
</body>
</html>
