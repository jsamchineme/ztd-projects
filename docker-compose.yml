# Local Postgres for development/testing — keeps provider parity with Neon (production).
# Usage: `npm run db:up` then `npm run prisma:migrate && npm run seed`.
services:
  db:
    image: postgres:16-alpine
    container_name: debbskitchen-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: debbskitchen
    ports:
      - "5432:5432"
    volumes:
      - ./.pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d debbskitchen"]
      interval: 5s
      timeout: 5s
      retries: 10
