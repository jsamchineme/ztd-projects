<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>ZTD Office — Control panel (prototype · design B)</title>
<link rel="icon" href="/ztdoffice-logo.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400..650&family=Inter:wght@400;450;500;550;600&display=swap" rel="stylesheet">
<style>
  /* ============================================================
     ZTD Office control panel — prototype, DESIGN B.
     Editorial & quiet: warm paper, serif display, hairlines,
     navy #0b3f70 + gold #c9a227 used sparingly.
     Compare with design A at /prototype/panel.html
     ============================================================ */
  :root {
    --bg: #f5f3ee; --panel: #fdfcf9; --panel-2: #f8f6f1; --sunk: #edeae2;
    --ink: #1d1b17; --ink-2: #5c5850; --ink-3: #9a948a;
    --line: #e5e1d7; --line-2: #eeebe3;
    --brand: #0b3f70; --brand-ink: #fdfcf9; --brand-soft: #e9eef4; --brand-text: #0b3f70;
    --gold: #c9a227; --gold-soft: #f4edda; --gold-text: #78601a;
    --ok: #2e7a4e; --ok-soft: #e9f2ea;
    --warn: #96661c; --warn-soft: #f6eeda;
    --bad: #a63a34; --bad-soft: #f6e8e5;
    --radius: 14px; --radius-sm: 10px;
    --shadow: 0 1px 0 rgba(29,27,23,.03);
    --shadow-lg: 0 32px 80px -16px rgba(29,27,23,.3), 0 2px 8px rgba(29,27,23,.06);
    --serif: "Fraunces", "Iowan Old Style", Georgia, serif;
  }
  .dark {
    --bg: #131210; --panel: #1b1a17; --panel-2: #1e1d19; --sunk: #262420;
    --ink: #ece9e1; --ink-2: #a9a399; --ink-3: #6e6960;
    --line: #2b2924; --line-2: #232119;
    --brand: #8db4da; --brand-ink: #0d1b28; --brand-soft: #1b2836; --brand-text: #a4c5e6;
    --gold: #d2ab45; --gold-soft: #2a2412; --gold-text: #dfc06f;
    --ok: #5cb286; --ok-soft: #16261d;
    --warn: #d6a24e; --warn-soft: #2a2113;
    --bad: #de7f73; --bad-soft: #2b1715;
    --shadow: 0 1px 0 rgba(0,0,0,.25);
    --shadow-lg: 0 32px 80px -16px rgba(0,0,0,.75), 0 2px 8px rgba(0,0,0,.4);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    font-family: "Inter", ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
    font-size: 14px; line-height: 1.55; color: var(--ink); background: var(--bg);
    -webkit-font-smoothing: antialiased; font-feature-settings: "cv11", "ss01";
  }
  button, input, select, textarea { font: inherit; color: inherit; }
  a { color: inherit; text-decoration: none; }
  ::selection { background: color-mix(in srgb, var(--gold) 30%, transparent); }
  svg.i { width: 16px; height: 16px; flex: none; stroke: currentColor; fill: none; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }

  /* micro-label: the recurring editorial device */
  .nav-label, h2, th, .stat .k, .badge, .chip {
    text-transform: uppercase; letter-spacing: .09em; font-weight: 600;
  }

  /* ---------- prototype ribbon ---------- */
  .ribbon {
    position: fixed; left: 50%; bottom: 16px; transform: translateX(-50%); z-index: 40;
    display: flex; align-items: center; gap: 12px; padding: 6px 7px 6px 16px;
    background: var(--ink); color: var(--bg); border-radius: 999px; box-shadow: var(--shadow-lg);
    font-size: 12.5px; white-space: nowrap;
  }
  .ribbon b { font-weight: 600; }
  .ribbon .vlink { text-decoration: underline; text-underline-offset: 3px; opacity: .75; }
  .ribbon .vlink:hover { opacity: 1; }
  .ribbon .seg { display: flex; background: rgba(127,127,127,.25); border-radius: 999px; padding: 2px; }
  .ribbon .seg button { border: 0; background: none; padding: 5px 12px; border-radius: 999px; cursor: pointer; color: inherit; opacity: .72; font-size: 12.5px; }
  .ribbon .seg button.on { background: var(--bg); color: var(--ink); opacity: 1; font-weight: 600; }
  .ribbon .icon-btn { color: inherit; }

  /* ---------- layout ---------- */
  .app { display: grid; grid-template-columns: 264px 1fr; min-height: 100vh; }
  aside {
    position: sticky; top: 0; height: 100vh; display: flex; flex-direction: column;
    background: transparent; border-right: 1px solid var(--line); padding: 26px 18px 22px;
  }
  .brand { display: flex; align-items: center; gap: 12px; padding: 0 8px 22px; }
  .brand img { width: 34px; height: 34px; border-radius: 9px; }
  .brand .t { font-family: var(--serif); font-weight: 550; letter-spacing: 0; font-size: 17px; line-height: 1.1; }
  .brand .s { color: var(--ink-3); font-size: 11px; text-transform: uppercase; letter-spacing: .09em; font-weight: 550; margin-top: 2px; }
  .tenant {
    display: flex; align-items: center; gap: 10px; padding: 11px 10px; margin: 0 0 16px;
    border: 1px solid var(--line); border-radius: var(--radius-sm); background: var(--panel);
  }
  .tenant .n { font-weight: 600; font-size: 13px; line-height: 1.25; }
  .tenant .d { color: var(--ink-3); font-size: 12px; }
  .nav-label { color: var(--ink-3); font-size: 10.5px; padding: 18px 10px 8px; }
  nav a {
    display: flex; align-items: center; gap: 11px; padding: 8px 10px; border-radius: 8px;
    color: var(--ink-2); font-weight: 500; margin-bottom: 1px; position: relative;
  }
  nav a:hover { background: var(--sunk); color: var(--ink); }
  nav a.on { background: var(--panel); color: var(--ink); font-weight: 600; border: 1px solid var(--line); box-shadow: var(--shadow); }
  nav a.on::before { content: ""; position: absolute; left: -18px; top: 8px; bottom: 8px; width: 2px; background: var(--gold); border-radius: 2px; }
  nav a .count { margin-left: auto; font-size: 11.5px; color: var(--ink-3); font-variant-numeric: tabular-nums; font-weight: 500; }
  .side-foot { margin-top: auto; border-top: 1px solid var(--line); padding-top: 16px; display: flex; align-items: center; gap: 10px; }
  .side-foot .n { font-weight: 600; font-size: 13px; line-height: 1.2; }
  .side-foot .d { color: var(--ink-3); font-size: 12px; }

  main { min-width: 0; padding: 40px 48px 120px; max-width: 1220px; width: 100%; }
  .crumbs { display: flex; align-items: center; gap: 6px; color: var(--ink-3); font-size: 12px; margin-bottom: 14px; text-transform: uppercase; letter-spacing: .07em; font-weight: 550; }
  .crumbs a:hover { color: var(--ink); }
  .crumbs svg.i { width: 12px; height: 12px; }
  .head { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; margin-bottom: 30px; flex-wrap: wrap; }
  h1 { font-family: var(--serif); font-size: 34px; line-height: 1.12; letter-spacing: -.005em; font-weight: 520; margin: 0; }
  .sub { color: var(--ink-2); margin-top: 8px; font-size: 14px; }
  h2 { font-size: 11.5px; color: var(--ink-2); margin: 0; }
  .actions { display: flex; gap: 8px; flex-wrap: wrap; }

  /* ---------- primitives ---------- */
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); }
  .card-h { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 18px 22px 0; }
  .card-h .sub { margin-top: 4px; font-size: 13px; text-transform: none; letter-spacing: 0; }
  .card-b { padding: 20px 22px; }
  .grid { display: grid; gap: 14px; }
  .grid > * { min-width: 0; }
  .g4 { grid-template-columns: repeat(4, minmax(0,1fr)); }
  .g3 { grid-template-columns: repeat(3, minmax(0,1fr)); }
  .g2 { grid-template-columns: minmax(0,1.7fr) minmax(0,1fr); }
  .stack { display: grid; gap: 14px; align-content: start; }
  .muted { color: var(--ink-2); } .faint { color: var(--ink-3); }
  .small { font-size: 12.5px; }
  .num { font-variant-numeric: tabular-nums; }
  .mono { font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; font-size: 12px; }

  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 8px; height: 38px; padding: 0 16px;
    border-radius: 10px; border: 1px solid var(--line); background: var(--panel); color: var(--ink);
    font-weight: 550; font-size: 13.5px; cursor: pointer; white-space: nowrap; transition: background .12s, border-color .12s, transform .06s;
  }
  .btn:hover { background: var(--sunk); border-color: var(--ink-3); }
  .btn:active { transform: translateY(1px); }
  .btn.primary { background: var(--brand); border-color: var(--brand); color: var(--brand-ink); }
  .btn.primary:hover { filter: brightness(1.12); }
  .btn.gold { background: var(--gold); border-color: var(--gold); color: #322605; }
  .btn.gold:hover { filter: brightness(1.05); }
  .btn.ghost { border-color: transparent; background: none; }
  .btn.ghost:hover { background: var(--sunk); border-color: transparent; }
  .btn.danger { color: var(--bad); }
  .btn.sm { height: 31px; padding: 0 12px; font-size: 12.5px; border-radius: 8px; }
  .icon-btn { width: 32px; height: 32px; padding: 0; display: inline-grid; place-items: center; border-radius: 8px; border: 0; background: none; color: var(--ink-2); cursor: pointer; }
  .icon-btn:hover { background: var(--sunk); color: var(--ink); }

  .badge {
    display: inline-flex; align-items: center; gap: 6px; height: 21px; padding: 0 9px; border-radius: 999px;
    font-size: 10px; background: transparent; color: var(--ink-2); white-space: nowrap; border: 1px solid var(--line);
  }
  .badge svg.i { width: 11px; height: 11px; stroke-width: 2.2; }
  .badge.lite { }
  .badge.premium { border-color: color-mix(in srgb, var(--brand) 40%, transparent); color: var(--brand-text); }
  .badge.business { border-color: color-mix(in srgb, var(--gold) 55%, transparent); color: var(--gold-text); background: var(--gold-soft); }
  .badge.ok { border-color: color-mix(in srgb, var(--ok) 35%, transparent); color: var(--ok); }
  .badge.warn { border-color: color-mix(in srgb, var(--warn) 40%, transparent); color: var(--warn); background: var(--warn-soft); }
  .badge.bad { border-color: color-mix(in srgb, var(--bad) 40%, transparent); color: var(--bad); background: var(--bad-soft); }
  .dot { width: 6px; height: 6px; border-radius: 50%; background: currentColor; display: inline-block; }

  .avatar {
    width: 32px; height: 32px; border-radius: 50%; display: grid; place-items: center; flex: none;
    font-size: 11px; font-weight: 600; color: #fff; letter-spacing: .04em;
  }
  .avatar.sq { border-radius: 9px; }
  .avatar.lg { width: 46px; height: 46px; font-size: 15px; border-radius: 13px; }

  /* stat tiles */
  .stat .k { color: var(--ink-3); font-size: 10.5px; display: flex; align-items: center; gap: 8px; }
  .stat .k svg.i { width: 13px; height: 13px; }
  .stat .v { font-family: var(--serif); font-size: 31px; font-weight: 500; letter-spacing: 0; margin-top: 10px; font-variant-numeric: tabular-nums; line-height: 1.05; }
  .stat .v small { font-family: "Inter", sans-serif; font-size: 13px; color: var(--ink-3); font-weight: 500; letter-spacing: 0; }
  .stat .f { color: var(--ink-3); font-size: 12.5px; margin-top: 8px; }

  /* meters */
  .meter { height: 4px; background: var(--sunk); border-radius: 999px; overflow: hidden; }
  .meter > i { display: block; height: 100%; border-radius: 999px; background: var(--brand); transition: width .4s cubic-bezier(.2,.8,.2,1); }
  .meter.warn > i { background: var(--warn); }
  .meter.full > i { background: var(--bad); }
  .meter.lg { height: 5px; }
  .usage { display: grid; gap: 8px; }
  .usage .row { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
  .usage .row .muted { display: inline-flex; align-items: center; gap: 7px; font-size: 12px; text-transform: uppercase; letter-spacing: .07em; font-weight: 550; color: var(--ink-3); }
  .usage .row b { font-weight: 600; font-variant-numeric: tabular-nums; }
  .mini { display: grid; gap: 6px; min-width: 110px; }
  .mini .t { font-size: 12.5px; font-variant-numeric: tabular-nums; color: var(--ink-2); }

  /* tables */
  .table-wrap { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; }
  th { text-align: left; font-size: 10px; color: var(--ink-3); padding: 12px 22px; border-bottom: 1px solid var(--line); white-space: nowrap; background: transparent; }
  td { padding: 13px 22px; border-bottom: 1px solid var(--line-2); vertical-align: middle; }
  tr:last-child td { border-bottom: 0; }
  tbody tr.click { cursor: pointer; }
  tbody tr.click:hover td { background: var(--panel-2); }
  .who { display: flex; align-items: center; gap: 12px; min-width: 0; }
  .who .n { font-weight: 550; line-height: 1.25; }
  .who .d { color: var(--ink-3); font-size: 12.5px; }
  td.r, th.r { text-align: right; }
  .tag { font-size: 9.5px; font-weight: 650; color: var(--gold-text); background: var(--gold-soft); padding: 2px 6px; border-radius: 4px; margin-left: 6px; letter-spacing: .08em; }
  tr.suspended td:not(:last-child) { opacity: .45; }
  .hidden-col { display: none; }

  /* toolbar */
  .toolbar { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 14px 22px; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
  .search { position: relative; }
  .search svg { position: absolute; left: 11px; top: 11px; color: var(--ink-3); }
  .search input { padding-left: 34px; width: 270px; }
  .chips { display: flex; gap: 6px; flex-wrap: wrap; }
  .chip { height: 29px; padding: 0 13px; border-radius: 999px; border: 1px solid var(--line); background: transparent; cursor: pointer; font-size: 10.5px; color: var(--ink-2); }
  .chip.on { background: var(--ink); color: var(--bg); border-color: var(--ink); }

  /* forms */
  .field { display: grid; gap: 7px; }
  .field label { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .08em; color: var(--ink-2); }
  .field .hint { font-size: 12.5px; color: var(--ink-3); text-transform: none; letter-spacing: 0; }
  .input, select.input {
    height: 40px; padding: 0 13px; border: 1px solid var(--line); border-radius: 10px; background: var(--panel);
    outline: none; width: 100%; transition: border-color .12s, box-shadow .12s;
  }
  .input:focus { border-color: var(--brand); box-shadow: 0 0 0 3px color-mix(in srgb, var(--brand) 14%, transparent); }
  .addon { display: flex; align-items: stretch; }
  .addon .input { border-radius: 10px 0 0 10px; }
  .addon span { display: grid; place-items: center; padding: 0 13px; border: 1px solid var(--line); border-left: 0; border-radius: 0 10px 10px 0; background: var(--sunk); color: var(--ink-2); font-size: 13px; white-space: nowrap; }
  .addon.pre .input { border-radius: 0 10px 10px 0; }
  .addon.pre span { border: 1px solid var(--line); border-right: 0; border-radius: 10px 0 0 10px; }
  .form { display: grid; gap: 18px; }
  .form .two { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .stepper { display: inline-flex; align-items: center; border: 1px solid var(--line); border-radius: 10px; height: 40px; background: var(--panel); }
  .stepper button { width: 38px; height: 100%; border: 0; background: none; cursor: pointer; color: var(--ink-2); font-size: 16px; }
  .stepper button:hover { background: var(--sunk); }
  .stepper span { min-width: 38px; text-align: center; font-weight: 600; font-variant-numeric: tabular-nums; }
  .checks { display: grid; gap: 2px; max-height: 220px; overflow: auto; border: 1px solid var(--line); border-radius: 10px; padding: 4px; background: var(--panel); }
  .checks label { display: flex; align-items: center; gap: 10px; padding: 7px 8px; border-radius: 7px; cursor: pointer; font-weight: 450; text-transform: none; letter-spacing: 0; font-size: 13.5px; color: var(--ink); }
  .checks label:hover { background: var(--sunk); }
  .checks input { accent-color: var(--brand); width: 15px; height: 15px; }
  .seg2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .opt { border: 1px solid var(--line); border-radius: 12px; padding: 13px 15px; cursor: pointer; display: grid; gap: 2px; background: var(--panel); text-align: left; }
  .opt b { font-weight: 600; font-size: 13.5px; }
  .opt span { color: var(--ink-3); font-size: 12.5px; }
  .opt.on { border-color: var(--ink); box-shadow: inset 0 0 0 1px var(--ink); }

  /* lists */
  .list { display: grid; }
  .li { display: flex; align-items: center; gap: 12px; padding: 13px 22px; border-top: 1px solid var(--line-2); }
  .li:first-child { border-top: 0; }
  .li .grow { flex: 1; min-width: 0; }
  .li .n { font-weight: 550; }
  .li .d { color: var(--ink-3); font-size: 12.5px; }
  .ic { width: 32px; height: 32px; border-radius: 9px; display: grid; place-items: center; flex: none; background: var(--sunk); color: var(--ink-2); }
  .ic.warn { background: var(--warn-soft); color: var(--warn); }
  .ic.bad { background: var(--bad-soft); color: var(--bad); }
  .ic.ok { background: var(--ok-soft); color: var(--ok); }
  .ic.brand { background: var(--brand-soft); color: var(--brand-text); }
  .members { display: flex; }
  .members .avatar { width: 24px; height: 24px; font-size: 9px; border: 2px solid var(--panel); margin-left: -6px; }
  .members .avatar:first-child { margin-left: 0; }

  /* plan cards */
  .plans { display: grid; grid-template-columns: repeat(3, minmax(0,1fr)); gap: 14px; align-items: stretch; }
  .plan { position: relative; display: flex; flex-direction: column; padding: 28px 26px 26px; }
  .plan.featured { border-color: var(--ink); box-shadow: inset 0 0 0 1px var(--ink), var(--shadow); }
  .plan .flag { position: absolute; top: -11px; left: 26px; background: var(--gold); color: #322605; font-size: 10px; font-weight: 650; padding: 4px 11px; border-radius: 999px; text-transform: uppercase; letter-spacing: .09em; }
  .plan .pn { font-family: var(--serif); font-size: 21px; font-weight: 550; display: flex; align-items: center; gap: 8px; }
  .plan .pb { color: var(--ink-2); font-size: 13px; margin-top: 6px; min-height: 40px; }
  .plan .pp { margin: 20px 0 4px; display: flex; align-items: baseline; gap: 7px; }
  .plan .pp b { font-family: var(--serif); font-size: 44px; letter-spacing: -.01em; font-weight: 500; line-height: 1; }
  .plan .pp span { color: var(--ink-3); font-size: 13px; }
  .plan .pa { color: var(--ink-3); font-size: 12.5px; }
  .plan ul { list-style: none; padding: 0; margin: 22px 0 24px; display: grid; gap: 10px; border-top: 1px solid var(--line-2); padding-top: 20px; }
  .plan li { display: flex; gap: 10px; align-items: flex-start; color: var(--ink-2); font-size: 13.5px; }
  .plan li svg { color: var(--ok); margin-top: 2px; stroke-width: 2; }
  .plan li.no { color: var(--ink-3); }
  .plan li.no svg { color: var(--ink-3); }
  .plan li b { color: var(--ink); font-weight: 600; }
  .plan .btn { margin-top: auto; width: 100%; }
  .plan.current { background: var(--panel-2); }

  /* banners */
  .banner { display: flex; align-items: center; gap: 14px; padding: 14px 18px; border-radius: 12px; border: 1px solid; margin-bottom: 14px; background: var(--panel); }
  .banner.warn { border-color: color-mix(in srgb, var(--warn) 35%, transparent); }
  .banner.brand { border-color: color-mix(in srgb, var(--brand) 30%, transparent); }
  .banner .grow { flex: 1; }
  .banner b { font-weight: 600; }

  .kv { display: grid; grid-template-columns: auto 1fr; gap: 11px 16px; font-size: 13.5px; }
  .kv dt { color: var(--ink-3); }
  .kv dd { margin: 0; text-align: right; font-weight: 500; }
  .sep { height: 1px; background: var(--line); margin: 18px 0; border: 0; }

  .hero {
    background: linear-gradient(170deg, #10395e 0%, #0b2c4b 100%); color: #fcfbf7; border: 0; overflow: hidden; position: relative;
  }
  .hero::before { content: ""; position: absolute; left: 0; right: 0; top: 0; height: 3px; background: linear-gradient(90deg, var(--gold), color-mix(in srgb, var(--gold) 20%, transparent)); }
  .hero::after { content: ""; position: absolute; right: -80px; bottom: -120px; width: 320px; height: 320px; border-radius: 50%; background: radial-gradient(circle, rgba(255,214,120,.14), transparent 70%); }
  .hero h1 { color: #fcfbf7; }
  .hero .muted { color: rgba(252,251,247,.72); }
  .hero .btn { border-color: rgba(252,251,247,.28); background: transparent; color: #fcfbf7; }
  .hero .btn:hover { background: rgba(252,251,247,.1); border-color: rgba(252,251,247,.5); }
  .hero .btn.gold { background: var(--gold); color: #322605; border-color: var(--gold); }

  .bars { display: grid; gap: 13px; }
  .bars .b { display: grid; grid-template-columns: 76px 1fr 44px; gap: 12px; align-items: center; font-size: 12.5px; }
  .bars .b .meter { height: 5px; }

  .empty { text-align: center; padding: 44px 20px; color: var(--ink-3); }

  /* modal + menu + toast */
  .scrim { position: fixed; inset: 0; background: rgba(24,20,14,.4); backdrop-filter: blur(4px); display: grid; place-items: center; z-index: 60; padding: 20px; animation: fade .15s ease; }
  .modal { width: 100%; max-width: 480px; background: var(--panel); border-radius: 18px; box-shadow: var(--shadow-lg); border: 1px solid var(--line); animation: pop .18s cubic-bezier(.2,.8,.2,1); max-height: calc(100vh - 40px); overflow: auto; }
  .modal.wide { max-width: 620px; }
  .modal-h { padding: 26px 26px 4px; display: flex; justify-content: space-between; gap: 12px; }

      attention.push(['alert', 'warn', `${c.name} is at their inbox limit`, `${c.inboxes.length} of ${l.inboxes} on ${plan(c).name}${next ? ` · upgrade to ${PLANS[next].name} = +${gbp(PLANS[next].price - monthly(c))}/mo` : ''}`, `#/staff/clients/${c.id}`]);
    }
    c.domains.forEach(d => { const bad = d.dns.filter(r => !r.ok); if (bad.length) attention.push(['globe', 'warn', `${d.name} isn't fully set up`, `Waiting for ${bad.map(r => r.type).join(' and ')} at the client's DNS provider`, `#/staff/clients/${c.id}`]); });
  });
  if (left <= 5) attention.unshift(['key', 'bad', `Only ${left} mail licence seats left`, `${seats} of ${LICENCE.seats} used · add seats in the Stalwart portal before the next client`, 'https://stalw.art/pricing']);
  const mix = ORDER.map(id => [id, paying.filter(c => c.plan === id).length]);

  return `
    <div class="head"><div><h1>Good evening, Samuel</h1><div class="sub">Here's how ZTD Office is doing today.</div></div>
      <div class="actions"><button class="btn primary" onclick="newClient()">${icon('plus')}New client</button></div></div>

    <div class="grid g4" style="margin-bottom:16px">
      <div class="card card-b stat"><div class="k">${icon('pound')}Monthly revenue</div><div class="v">${gbp(mrr)}</div><div class="f">${gbp(mrr * 12)} a year · ${paying.length} paying clients</div></div>
      <div class="card card-b stat"><div class="k">${icon('users')}Clients</div><div class="v">${paying.length}</div><div class="f">${mix.map(([id, n]) => `${n} ${PLANS[id].name}`).join(' · ')}</div></div>
      <div class="card card-b stat"><div class="k">${icon('key')}Licence seats</div><div class="v">${seats}<small> / ${LICENCE.seats}</small></div><div style="margin-top:10px">${meter(seats, LICENCE.seats)}</div></div>
      <div class="card card-b stat"><div class="k">${icon('globe')}Domains live</div><div class="v">${healthy}<small> / ${domains.length}</small></div><div class="f">MX, SPF, DKIM, DMARC checked hourly</div></div>
    </div>

    <div class="grid g2">
      <div class="stack">
        <div class="card">
          <div class="card-h"><div><h2>Needs attention</h2><div class="sub muted">Things that cost you money or mail if ignored</div></div></div>
          <div class="list" style="margin-top:10px">
            ${attention.length ? attention.map(([ic, cls, t, d, href]) => `
              <a class="li" href="${href}" ${href.startsWith('http') ? 'target="_blank" rel="noopener"' : ''}><span class="ic ${cls}">${icon(ic)}</span><div class="grow"><div class="n">${esc(t)}</div><div class="d">${esc(d)}</div></div><span class="faint">${icon('chev')}</span></a>`).join('')
              : `<div class="empty">${icon('check')} All clear</div>`}
          </div>
        </div>
        <div class="card">
          <div class="card-h"><h2>Clients</h2><a class="btn sm ghost" href="#/staff/clients">View all ${icon('arrow')}</a></div>
          <div class="table-wrap" style="margin-top:12px">${clientTable(paying, { compact: true })}</div>
        </div>
      </div>
      <div class="stack">
        <div class="card card-b">
          <h2>Mail licence</h2>
          <div class="sub muted small">Stalwart Enterprise · ztdoffice.com</div>
          <div class="usage" style="margin-top:16px"><div class="row"><span class="muted">Mailboxes</span><b>${seats} of ${LICENCE.seats}</b></div>${meter(seats, LICENCE.seats, true)}</div>
          <dl class="kv" style="margin-top:16px"><dt>Renews</dt><dd>${LICENCE.renews}</dd><dt>Cost per seat</dt><dd>≈ €2 / year</dd><dt>Aliases & groups</dt><dd>Free, not counted</dd></dl>
        </div>
        <div class="card card-b">
          <h2>Plan mix</h2>
          <div class="bars" style="margin-top:16px">${mix.map(([id, n]) => `<div class="b"><span>${PLANS[id].name}</span>${meter(n, Math.max(1, paying.length))}<span class="num r faint" style="text-align:right">${n}</span></div>`).join('')}</div>
        </div>
        <div class="card">
          <div class="card-h"><h2>Recent activity</h2></div>
          <div class="list" style="margin-top:8px">${activity.map(([ic, t, w]) => `<div class="li"><span class="ic">${icon(ic)}</span><div class="grow"><div style="font-size:13.5px">${esc(t)}</div><div class="d">${w}</div></div></div>`).join('')}</div>
        </div>
      </div>
    </div>`;
}

function clientTable(list, { compact } = {}) {
  if (!list.length) return `<div class="empty">No clients match.</div>`;
  const wide = compact ? 'hidden-col' : 'hide-sm';
  return `<table><thead><tr><th>Client</th><th>Plan</th><th class="hide-sm">Inboxes</th><th class="${wide}">Groups & aliases</th><th class="${wide}">Domain</th><th class="r">Price</th></tr></thead><tbody>
    ${list.map(c => { const l = limits(c), d = dnsState(c); return `
      <tr class="click ${c.status === 'suspended' ? 'suspended' : ''}" onclick="go('#/staff/clients/${c.id}')">
        <td><div class="who">${avatar(c.name, 'sq')}<div style="min-width:0"><div class="n">${esc(c.name)}</div><div class="d">${esc(domain(c))}</div></div></div></td>
        <td>${planBadge(c.plan)}${c.status === 'suspended' ? ' <span class="badge bad">Suspended</span>' : ''}</td>
        <td class="hide-sm">${mini(c.inboxes.length, l.inboxes)}</td>
        <td class="${wide}">${mini(c.aliases.length, l.aliases)}</td>
        <td class="${wide}"><span class="badge ${d.cls}"><span class="dot"></span>${d.text}</span></td>
        <td class="r num"><b>${gbp(monthly(c))}</b><span class="faint">/mo</span>${c.custom != null && !c.internal ? '<span class="tag">CUSTOM</span>' : ''}</td>
      </tr>`; }).join('')}
  </tbody></table>`;
}

function staffClients() {
  const list = clients.filter(c => !c.internal)
    .filter(c => filter === 'all' || c.plan === filter)
    .filter(c => !query || (c.name + ' ' + domain(c) + ' ' + c.contact).toLowerCase().includes(query.toLowerCase()));
  return `
    <div class="head"><div><h1>Clients</h1><div class="sub">Every business you host, their plan and what they've used.</div></div>
      <div class="actions"><button class="btn primary" onclick="newClient()">${icon('plus')}New client</button></div></div>
    <div class="card">
      <div class="toolbar">
        <div class="search">${icon('search')}<input class="input" placeholder="Search clients, domains, contacts" value="${esc(query)}" oninput="query=this.value; refreshClients()"></div>
        <div class="chips">${['all', ...ORDER].map(f => `<button class="chip ${filter === f ? 'on' : ''}" onclick="filter='${f}'; render()">${f === 'all' ? 'All plans' : PLANS[f].name}</button>`).join('')}</div>
      </div>
      <div class="table-wrap" id="ctable">${clientTable(list)}</div>
    </div>`;
}
function refreshClients() {
  const list = clients.filter(c => !c.internal).filter(c => filter === 'all' || c.plan === filter)
    .filter(c => !query || (c.name + ' ' + domain(c) + ' ' + c.contact).toLowerCase().includes(query.toLowerCase()));
  $('#ctable').innerHTML = clientTable(list);
}

      <div class="card card-b"><div class="usage"><div class="row"><span class="muted">Groups & aliases</span><b>${c.aliases.length} / ${l.aliases}</b></div>${meter(c.aliases.length, l.aliases, true)}</div></div>
      <div class="card card-b"><div class="usage"><div class="row"><span class="muted">Storage</span><b>${usedGB(c).toFixed(0)} GB</b></div>${meter(usedGB(c), c.inboxes.length * l.storage || 1, true)}<span class="faint small">${l.storage} GB per inbox</span></div></div>

function staffPlans() {
  return `

      <div class="actions"><span class="badge">Annual billing = 2 months free</span></div></div>

function planFeatures(p) {
  return [
    [true, `Website hosting & care`],
    [true, `<b>${p.inboxes}</b> email inboxes`],
    [true, `<b>${p.aliases}</b> groups & aliases`],
    [true, `<b>${p.storage} GB</b> per inbox`],
    [true, p.domains > 1 ? `<b>${p.domains}</b> domains` : '1 domain'],
    [true, 'Webmail, calendar & contacts'],
    [!!p.meetings, p.meetings || 'Online meetings (add-on)'],
    [p.shared > 0, p.shared ? `${p.shared} shared inbox${p.shared > 1 ? 'es' : ''}` : 'Shared inboxes'],
    [true, p.migration],
    [true, p.support],
  ];
}
function planCard(p, { featured, staff, current, client } = {}) {
  const feats = planFeatures(p);
  let action = '';
  if (staff) action = `<button class="btn" onclick="toast('Editing plans comes with the real build')">${icon('edit')}Edit plan</button>`;
  else if (current) action = `<button class="btn" disabled style="opacity:.6;cursor:default">Your current plan</button>`;
  else if (client) action = `<button class="btn ${featured ? 'primary' : ''}" onclick="changePlan('${client.id}','${p.id}')">${ORDER.indexOf(p.id) > ORDER.indexOf(client.plan) ? 'Upgrade to ' : 'Switch to '}${p.name}</button>`;
  return `<div class="card plan ${featured && !current ? 'featured' : ''} ${current ? 'current' : ''}">
    ${featured && !current ? '<span class="flag">Most popular</span>' : ''}${current ? '<span class="flag" style="background:var(--ink);color:var(--panel)">Current plan</span>' : ''}
    <div class="pn">${p.name}</div><div class="pb">${p.blurb}</div>
    <div class="pp"><b>${gbp(p.price)}</b><span>/ month</span></div>
    <div class="pa">or ${gbp(p.price * 10)} a year · email included free</div>
    <ul>${feats.map(([on, t]) => `<li class="${on ? '' : 'no'}">${icon(on ? 'check' : 'x')}<span>${t}</span></li>`).join('')}</ul>
    ${action}
  </div>`;
}
function compareTable() {
  const rows = [
    ['Price / month', p => gbp(p.price)], ['Website', () => icon('check')], ['Inboxes', p => p.inboxes], ['Groups & aliases', p => p.aliases],
    ['Storage per inbox', p => p.storage + ' GB'], ['Domains', p => p.domains], ['Shared inboxes', p => p.shared || '—'],
    ['Online meetings', p => p.meetings ? p.meetings.replace('Meetings ', '').replace(' meetings', '') : 'Add-on'], ['Sending limit / inbox / day', p => p.send.toLocaleString()],
    ['Moving old email', p => p.migration], ['Support', p => p.support],
  ];
  return `<table><thead><tr><th></th>${ORDER.map(id => `<th>${planBadge(id)}</th>`).join('')}</tr></thead><tbody>
    ${rows.map(([k, f]) => `<tr><td class="muted">${k}</td>${ORDER.map(id => `<td class="num">${f(PLANS[id])}</td>`).join('')}</tr>`).join('')}</tbody></table>`;
}

function inboxCard(c, { full } = {}) {
  const l = limits(c), at = c.inboxes.length >= l.inboxes;
  const list = full ? c.inboxes : c.inboxes.slice(0, 6);
  return `<div class="card">
    <div class="card-h"><div><h2>Inboxes</h2><div class="sub muted">${c.inboxes.length} of ${l.inboxes} used${at ? ' · limit reached' : ''}</div></div>
      <div class="actions">${!full ? `<a class="btn sm ghost" href="${role === 'staff' ? `#/client/${c.id}/inboxes` : `#/client/${c.id}/inboxes`}">View all</a>` : ''}<button class="btn sm ${at ? '' : 'primary'}" onclick="newInbox('${c.id}')">${icon('plus')}New inbox</button></div></div>
    <div class="table-wrap" style="margin-top:14px"><table><thead><tr><th>Person</th><th class="hide-sm">Storage</th><th class="hide-sm">Last sign-in</th><th></th></tr></thead><tbody>
      ${list.map(m => `<tr class="${m.status === 'suspended' ? 'suspended' : ''}">
        <td><div class="who">${avatar(m.name)}<div style="min-width:0"><div class="n">${esc(m.name)} ${m.admin ? '<span class="badge" style="height:19px;font-size:11px">Admin</span>' : ''}${m.status === 'suspended' ? '<span class="badge bad" style="height:19px;font-size:11px">Suspended</span>' : ''}</div><div class="d">${esc(m.local)}@${esc(domain(c))}</div></div></div></td>
        <td class="hide-sm">${mini(m.used, m.quota, ' GB')}</td>
        <td class="hide-sm muted small">${m.last}</td>
        <td class="r"><button class="icon-btn" onclick="inboxMenu(this,'${c.id}','${esc(m.local)}')" aria-label="Actions">${icon('more')}</button></td>
      </tr>`).join('')}
    </tbody></table></div>
    ${!full && c.inboxes.length > list.length ? `<div class="faint small" style="padding:10px 20px 14px">+ ${c.inboxes.length - list.length} more</div>` : ''}
  </div>`;
}

function groupsCard(c, { full } = {}) {
  const l = limits(c);
  const nameOf = local => c.inboxes.find(m => m.local === local)?.name || local;
  return `<div class="card">
    <div class="card-h"><div><h2>Groups & aliases</h2><div class="sub muted">${c.aliases.length} of ${l.aliases} used · don't use an inbox</div></div>
      <button class="btn sm" onclick="newAlias('${c.id}')">${icon('plus')}New</button></div>
    <div class="list" style="margin-top:12px">
      ${c.aliases.length ? c.aliases.map((a, i) => `<div class="li">
        <span class="ic ${a.type === 'group' ? 'brand' : ''}">${icon(a.type === 'group' ? 'users' : 'at')}</span>
        <div class="grow"><div class="n">${esc(a.local)}@${esc(domain(c))}</div>

function dnsCard(c) {
  return c.domains.map(d => { const bad = d.dns.filter(r => !r.ok).length; return `<div class="card">

}

    </div>`;
}

const clientHead = (t, s, act = '') => `<div class="head"><div><h1>${t}</h1><div class="sub">${s}</div></div><div class="actions">${act}</div></div>`;

function clientInboxes(c) {
  const l = limits(c);
  return clientHead('Inboxes', `Each person gets their own inbox, calendar and contacts. ${c.inboxes.length} of ${l.inboxes} used.`)
    + inboxCard(c, { full: true });
}
function clientGroups(c) {
  return clientHead('Groups & aliases', 'Extra addresses that deliver into existing inboxes. They don\'t use up an inbox.')
    + `<div class="grid g3" style="margin-bottom:16px">
        <div class="card card-b"><span class="ic">${icon('at')}</span><div style="font-weight:600;margin-top:10px">Alias</div><div class="muted small">info@ goes straight into one person's inbox.</div></div>
        <div class="card card-b"><span class="ic brand">${icon('users')}</span><div style="font-weight:600;margin-top:10px">Group</div><div class="muted small">support@ sends a copy to everyone in the group. Reply-all keeps the team in the loop.</div></div>
        <div class="card card-b"><span class="ic warn">${icon('inbox')}</span><div style="font-weight:600;margin-top:10px">Shared inbox</div><div class="muted small">One inbox the team works from together. Uses an inbox on your plan${plan(c).shared ? '' : ' (Premium and up)'}.</div></div>
      </div>` + groupsCard(c, { full: true });
}
function clientDomain(c) {
  const d = c.domains[0], bad = d.dns.filter(r => !r.ok);
  const vals = { MX: ['MX', '@', '10 mx1.ztdoffice.com'], SPF: ['TXT', '@', 'v=spf1 mx include:amazonses.com ~all'], DKIM: ['TXT', 'ztd._domainkey', 'v=DKIM1; k=rsa; p=MIIBIjANBgkq…'], DMARC: ['TXT', '_dmarc', 'v=DMARC1; p=none; rua=mailto:dmarc@ztdoffice.com'], 'Auto-setup': ['CNAME', 'autodiscover', 'mx1.ztdoffice.com'], Website: ['A', '@', '62.238.17.10'] };
  return clientHead('Domain', `DNS records for ${esc(d.name)}. We check them every hour.`, `<button class="btn" onclick="toast('Checked just now — ${bad.length ? bad.length + ' still waiting' : 'all records live'}')">${icon('spark')}Check now</button>`)
    + (bad.length ? `<div class="banner warn"><span class="ic warn">${icon('alert')}</span><div class="grow"><b>${bad.length} record${bad.length > 1 ? 's' : ''} still to add.</b> <span class="muted">Mail may land in spam until ${bad.map(r => r.type).join(' and ')} ${bad.length > 1 ? 'are' : 'is'} in place. Send this page to whoever manages your domain, or ask us to do it.</span></div></div>` : '')
    + `<div class="card table-wrap"><table><thead><tr><th>Record</th><th>Type</th><th>Name</th><th>Value</th><th class="r">Status</th></tr></thead><tbody>
      ${d.dns.map(r => { const [t, n, v] = vals[r.type]; return `<tr><td><b style="font-weight:600">${r.type}</b></td><td class="mono">${t}</td><td class="mono">${n}</td><td class="mono" style="max-width:340px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(v)}</td><td class="r">${r.ok ? `<span class="badge ok">${icon('check')}Live</span>` : `<span class="badge warn">Waiting</span>`}</td></tr>`; }).join('')}
      </tbody></table></div>`;
}
function clientPlan(c) {
  return clientHead('Plan & billing', `You're on <b>${plan(c).name}</b> at ${gbp(monthly(c))} a month. Website and email are included.`)
    + `<div class="plans" style="margin-top:12px">${ORDER.map(id => planCard(PLANS[id], { featured: id === 'premium', current: id === c.plan, client: c })).join('')}</div>
      <h2 style="margin:36px 0 14px">Need a little more?</h2>
      <div class="grid g4">${ADDONS.map(a => `<div class="card card-b"><span class="ic brand">${icon(a.icon)}</span><div style="font-weight:600;margin-top:12px">${a.name}</div><div style="margin-top:2px"><b>${gbp(a.price)}</b> <span class="faint small">${a.unit}</span></div><button class="btn sm" style="margin-top:12px;width:100%" onclick="${a.id === 'inbox' ? `addExtraInbox('${c.id}')` : `toast('Request sent to ZTD Office')`}">Add</button></div>`).join('')}</div>`;
}

/* ============================================================
   Actions (prototype: change in-memory data only)
   ============================================================ */
function newInbox(id) {
  const c = byId(id), l = limits(c);
  if (c.inboxes.length >= l.inboxes) return upgradePrompt(c);
  const s = modal(`${modalHead('Add a person', `Creates an inbox, calendar and contacts. ${l.inboxes - c.inboxes.length} of ${l.inboxes} inboxes left.`)}
    <div class="modal-b form">
      <div class="field"><label>Full name</label><input class="input" id="ni-name" placeholder="Jane Smith" autocomplete="off"></div>
      <div class="field"><label>Email address</label><div class="addon"><input class="input" id="ni-local" placeholder="jane" autocomplete="off"><span>@${esc(domain(c))}</span></div></div>
      <div class="field"><label>First sign-in</label>
        <div class="seg2"><button class="opt on" data-v="invite" onclick="pick(this)"><b>Email an invite</b><span>They choose their own password</span></button><button class="opt" data-v="pw" onclick="pick(this)"><b>Set a password</b><span>You give it to them</span></button></div></div>
      <div class="field" id="ni-invite-f"><label>Send the invite to</label><input class="input" id="ni-invite" placeholder="their personal email"></div>
      <div class="hint faint small">${l.storage} GB storage · two-step sign-in required on first login</div>
    </div>
    <div class="modal-f"><button class="btn" onclick="closeModal()">Cancel</button><button class="btn primary" id="ni-go">Create inbox</button></div>`);
  const name = s.querySelector('#ni-name'), local = s.querySelector('#ni-local');
  name.addEventListener('input', () => { if (!local.dataset.touched) local.value = name.value.trim().split(/\s+/)[0].toLowerCase().replace(/[^a-z0-9.]/g, ''); });
  local.addEventListener('input', () => local.dataset.touched = 1);
  s.querySelector('#ni-go').onclick = () => {
    const n = name.value.trim(), lp = local.value.trim().toLowerCase();
    if (!n || !/^[a-z0-9][a-z0-9._-]*$/.test(lp)) return toast('Add a name and a valid address');
    if (c.inboxes.some(m => m.local === lp) || c.aliases.some(a => a.local === lp)) return toast(`${lp}@ is already in use`);
    c.inboxes.push({ id: domain(c) + ':' + lp, name: n, local: lp, quota: l.storage, used: 0, status: 'active', last: 'Never' });
    closeModal(); render(); toast(`${lp}@${domain(c)} created`);
  };
}
function pick(btn) { btn.parentElement.querySelectorAll('.opt').forEach(b => b.classList.toggle('on', b === btn)); const f = $('#ni-invite-f'); if (f) f.style.display = btn.dataset.v === 'invite' ? '' : 'none'; }

function upgradePrompt(c) {
  const l = limits(c), next = PLANS[ORDER[ORDER.indexOf(c.plan) + 1]];
  const s = modal(`${modalHead(`You've used all ${l.inboxes} inboxes`, `Your ${plan(c).name} plan includes ${l.inboxes}. Pick how you'd like to add more.`)}
    <div class="modal-b upg">
      ${next ? `<button class="opt on" data-v="up"><span class="ic brand">${icon('spark')}</span><span class="grow"><b>Upgrade to ${next.name}</b><span>${next.inboxes} inboxes, ${next.aliases} groups & aliases, ${next.storage} GB each${next.meetings ? ', ' + next.meetings.toLowerCase() : ''}</span></span><span class="price"><b>${gbp(next.price)}</b><span class="faint small">/mo</span></span></button>` : ''}
      <button class="opt ${next ? '' : 'on'}" data-v="one"><span class="ic">${icon('plus')}</span><span class="grow"><b>Add one inbox</b><span>Stay on ${plan(c).name}, add a single extra inbox</span></span><span class="price"><b>+£5</b><span class="faint small">/mo</span></span></button>
    </div>
    <div class="modal-f"><button class="btn" onclick="closeModal()">Not now</button><button class="btn primary" id="up-go">Continue</button></div>`);
  s.querySelectorAll('.opt').forEach(o => o.onclick = () => s.querySelectorAll('.opt').forEach(x => x.classList.toggle('on', x === o)));
  s.querySelector('#up-go').onclick = () => {
    const v = s.querySelector('.opt.on').dataset.v;
    closeModal();
    if (v === 'up') { c.plan = next.id; if (c.custom != null && !c.internal) c.custom = null; render(); toast(`Upgraded to ${next.name}`); }
    else addExtraInbox(c.id);
  };
}
function addExtraInbox(id) { const c = byId(id); c.extra.inboxes++; if (c.custom != null && !c.internal) c.custom += 5; render(); toast('One extra inbox added (+£5/mo)'); }
function changePlan(id, to) {
  const c = byId(id), p = PLANS[to], up = ORDER.indexOf(to) > ORDER.indexOf(c.plan);
  if (!up && c.inboxes.length > p.inboxes + c.extra.inboxes) return toast(`Remove ${c.inboxes.length - p.inboxes - c.extra.inboxes} inbox(es) before moving to ${p.name}`);
  modal(`${modalHead(`${up ? 'Upgrade' : 'Switch'} to ${p.name}?`, `${gbp(p.price)} a month from today. We'll adjust your next invoice for the days left this month.`)}
    <div class="modal-b"><dl class="kv"><dt>Inboxes</dt><dd>${limits(c).inboxes} → ${p.inboxes + c.extra.inboxes}</dd><dt>Groups & aliases</dt><dd>${limits(c).aliases} → ${p.aliases}</dd><dt>Storage per inbox</dt><dd>${limits(c).storage} GB → ${p.storage} GB</dd><dt>Monthly</dt><dd>${gbp(monthly(c))} → ${gbp(p.price + c.extra.inboxes * 5)}</dd></dl></div>
    <div class="modal-f"><button class="btn" onclick="closeModal()">Cancel</button><button class="btn primary" onclick="byId('${id}').plan='${to}'; byId('${id}').custom=null; closeModal(); render(); toast('You are now on ${p.name}')">Confirm</button></div>`);
}

function newAlias(id) {
  const c = byId(id), l = limits(c);
  if (c.aliases.length >= l.aliases) return modal(`${modalHead(`You've used all ${l.aliases} groups & aliases`, 'Upgrade your plan for more, or remove one you no longer need.')}<div class="modal-f"><button class="btn" onclick="closeModal()">Close</button><button class="btn primary" onclick="closeModal(); go('#/client/${c.id}/plan')">See plans</button></div>`);
  const s = modal(`${modalHead('New group or alias', `${l.aliases - c.aliases.length} of ${l.aliases} left. These don't use an inbox.`)}
    <div class="modal-b form">
      <div class="seg2"><button class="opt on" data-v="group"><b>Group</b><span>Copies to several people</span></button><button class="opt" data-v="alias"><b>Alias</b><span>Into one person's inbox</span></button></div>
      <div class="field"><label>Address</label><div class="addon"><input class="input" id="na-local" placeholder="support" autocomplete="off"><span>@${esc(domain(c))}</span></div></div>
      <div class="field"><label id="na-who">Who gets the email</label><div class="checks">${c.inboxes.map(m => `<label><input type="checkbox" value="${esc(m.local)}">${avatar(m.name)}<span>${esc(m.name)} <span class="faint">${esc(m.local)}@</span></span></label>`).join('')}</div></div>
      <div class="hint faint small" id="na-hint">Tip: members can reply as support@ so customers always write back to the group.</div>
    </div>
    <div class="modal-f"><button class="btn" onclick="closeModal()">Cancel</button><button class="btn primary" id="na-go">Create</button></div>`);
  let type = 'group';
  s.querySelectorAll('.seg2 .opt').forEach(o => o.onclick = () => {
    type = o.dataset.v; s.querySelectorAll('.seg2 .opt').forEach(x => x.classList.toggle('on', x === o));
    s.querySelector('#na-who').textContent = type === 'group' ? 'Who gets the email' : 'Deliver to';
    s.querySelector('#na-hint').style.display = type === 'group' ? '' : 'none';
    if (type === 'alias') { const ch = [...s.querySelectorAll('.checks input:checked')]; ch.slice(1).forEach(x => x.checked = false); }
  });
  s.querySelector('.checks').addEventListener('change', e => { if (type === 'alias' && e.target.checked) s.querySelectorAll('.checks input').forEach(x => { if (x !== e.target) x.checked = false; }); });
  s.querySelector('#na-go').onclick = () => {
    const lp = s.querySelector('#na-local').value.trim().toLowerCase();
    const to = [...s.querySelectorAll('.checks input:checked')].map(x => x.value);
    if (!/^[a-z0-9][a-z0-9._-]*$/.test(lp)) return toast('Enter a valid address');
    if (!to.length) return toast('Choose at least one person');
    if (c.inboxes.some(m => m.local === lp) || c.aliases.some(a => a.local === lp)) return toast(`${lp}@ is already in use`);
    c.aliases.push({ local: lp, type, to });
    closeModal(); render(); toast(`${lp}@${domain(c)} created`);
  };
}

function inboxMenu(btn, id, local) {
  const c = byId(id), m = c.inboxes.find(x => x.local === local);
  menu(btn, [
    { icon: 'key', label: 'Reset password', run: () => toast(`Reset link sent for ${local}@${domain(c)}`) },
    { icon: 'db', label: 'Change storage', run: () => toast('Storage options come with the real build') },
    { icon: 'at', label: 'Add an alias for this person', run: () => newAlias(id) },
    '-',
    { icon: m.status === 'active' ? 'pause' : 'play', label: m.status === 'active' ? 'Suspend sign-in' : 'Resume sign-in', run: () => { m.status = m.status === 'active' ? 'suspended' : 'active'; render(); toast(`${local}@ ${m.status === 'active' ? 'resumed' : 'suspended'}`); } },
    { icon: 'trash', label: 'Delete inbox', danger: true, run: () => confirmDelete(`Delete ${local}@${domain(c)}?`, 'All email, calendars and contacts in this inbox are removed after 30 days. Groups that include this person are updated.', () => { c.inboxes = c.inboxes.filter(x => x !== m); c.aliases.forEach(a => a.to = a.to.filter(t => t !== local)); c.aliases = c.aliases.filter(a => a.to.length); render(); toast('Inbox deleted'); }) },
  ]);
}
function aliasMenu(btn, id, i) {
  const c = byId(id), a = c.aliases[i];
  menu(btn, [
    { icon: 'edit', label: a.type === 'group' ? 'Edit members' : 'Change who gets it', run: () => toast('Editing comes with the real build') },
    '-',
    { icon: 'trash', label: 'Delete', danger: true, run: () => confirmDelete(`Delete ${a.local}@${domain(c)}?`, 'Email sent to this address will bounce.', () => { c.aliases.splice(i, 1); render(); toast('Deleted'); }) },
  ]);
}
function clientMenu(btn, id) {
  const c = byId(id);
  menu(btn, [
    { icon: 'mail', label: 'Email the client', run: () => toast(`Opening email to ${c.email}`) },
    { icon: 'globe', label: 'Re-check DNS', run: () => toast('DNS checked just now') },
    '-',
    { icon: c.status === 'active' ? 'pause' : 'play', label: c.status === 'active' ? 'Suspend account' : 'Resume account', run: () => toggleSuspend(id) },
  ]);
}
function toggleSuspend(id) { const c = byId(id); c.status = c.status === 'active' ? 'suspended' : 'active'; render(); toast(`${c.name} ${c.status === 'active' ? 'resumed' : 'suspended'}`); }
function confirmDelete(t, p, run) {
  const s = modal(`${modalHead(t, p)}<div class="modal-f"><button class="btn" onclick="closeModal()">Cancel</button><button class="btn primary" style="background:var(--bad);border-color:var(--bad);color:#fff" id="cd-go">Delete</button></div>`);
  s.querySelector('#cd-go').onclick = () => { closeModal(); run(); };
}

function step(elId, d) { const el = $('#' + elId); el.textContent = Math.max(0, +el.textContent + d); }
function savePlan(id) {
  const c = byId(id);
  c.plan = $('#pf-plan').value;
  c.extra.inboxes = +$('#pf-extra').textContent;
  const v = $('#pf-price').value.trim();
  c.custom = v === '' ? null : Math.max(0, parseFloat(v) || 0);
  render(); toast(`${c.name}: ${plan(c).name}, ${gbp(monthly(c))}/mo`);
}

function newClient() {
  const s = modal(`${modalHead('New client', 'Sets up their domain and a first inbox for the main contact.')}
    <div class="modal-b form">
      <div class="field"><label>Business name</label><input class="input" id="nc-name" placeholder="Acme Ltd"></div>
      <div class="two"><div class="field"><label>Contact name</label><input class="input" id="nc-contact" placeholder="Jane Smith"></div>
      <div class="field"><label>Their domain</label><input class="input" id="nc-domain" placeholder="acme.co.uk"></div></div>
      <div class="field"><label>Plan</label><div class="seg2" style="grid-template-columns:repeat(3,1fr)">${ORDER.map(id => `<button class="opt ${id === 'premium' ? 'on' : ''}" data-v="${id}"><b>${PLANS[id].name}</b><span>${gbp(PLANS[id].price)}/mo · ${PLANS[id].inboxes} inboxes</span></button>`).join('')}</div></div>
      <div class="field"><label>Custom monthly price <span class="faint" style="font-weight:400">(optional)</span></label><div class="addon pre"><span>£</span><input class="input" id="nc-price" inputmode="decimal" placeholder="List price"></div></div>
    </div>
    <div class="modal-f"><button class="btn" onclick="closeModal()">Cancel</button><button class="btn primary" id="nc-go">Create client</button></div>`, { wide: true });
  let pl = 'premium';
  s.querySelectorAll('.opt').forEach(o => o.onclick = () => { pl = o.dataset.v; s.querySelectorAll('.opt').forEach(x => x.classList.toggle('on', x === o)); });
  s.querySelector('#nc-go').onclick = () => {
    const name = s.querySelector('#nc-name').value.trim(), contact = s.querySelector('#nc-contact').value.trim(), dom = s.querySelector('#nc-domain').value.trim().toLowerCase();
    if (!name || !contact || !/^[a-z0-9-]+(\.[a-z0-9-]+)+$/.test(dom)) return toast('Fill in the name, contact and a valid domain');
    if (LICENCE.seats - seatsUsed() < 1) return toast('No licence seats left — add seats first');
    const id = dom.replace(/[^a-z0-9]/g, '');
    const local = contact.split(/\s+/)[0].toLowerCase().replace(/[^a-z0-9]/g, '') || 'admin';
    const price = s.querySelector('#nc-price').value.trim();
    clients.push({ id, name, contact, email: `${local}@${dom}`, plan: pl, custom: price ? parseFloat(price) || 0 : null, extra: { inboxes: 0, aliases: 0, storage: 0 }, since: 'Oct 2026', status: 'active',
      domains: [{ name: dom, dns: dnsOk(['MX', 'SPF', 'DKIM', 'DMARC', 'Auto-setup', 'Website']) }],
      inboxes: [{ id: dom + ':' + local, name: contact, local, quota: PLANS[pl].storage, used: 0, status: 'active', last: 'Never', admin: true }], aliases: [] });
    closeModal(); go('#/staff/clients/' + id); toast(`${name} created · DNS records ready to send`);
  };
}

/* ============================================================
   Boot
   ============================================================ */
document.querySelectorAll('.ribbon [data-role]').forEach(b => b.onclick = () => go(b.dataset.role === 'staff' ? '#/staff' : '#/client/' + clientId));
function setTheme(dark) {
  document.documentElement.classList.toggle('dark', dark);
  $('#theme').innerHTML = icon(dark ? 'sun' : 'moon');
  try { localStorage.setItem('ztd-proto-theme', dark ? 'dark' : 'light'); } catch {}
}
$('#theme').onclick = () => setTheme(!document.documentElement.classList.contains('dark'));
setTheme((() => { try { return localStorage.getItem('ztd-proto-theme') === 'dark'; } catch { return false; } })());
if (!location.hash) location.hash = '#/staff';
render();
</script>
</body>
</html>
